<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Carentan — 12 de junho de 1944</title>
<style>
  html, body { margin: 0; height: 100%; background: #93a054; overflow: hidden;
               font: 13px/1.35 "Segoe UI", system-ui, sans-serif; color: #2b2f24; }
  canvas { display: block; width: 100%; height: 100%; cursor: grab; }
  canvas.arrastando { cursor: grabbing; }
  canvas.rota { cursor: crosshair; }

  .painel { position: fixed; background: rgba(243,239,225,.94); border: 1px solid #b9b19a;
            border-radius: 5px; box-shadow: 0 2px 10px rgba(20,35,25,.30); }

  #barra { left: 12px; right: 12px; bottom: 12px; display: flex; gap: 8px;
           align-items: center; padding: 7px 10px; }
  #barra button, #tropas button, #topo button, #topo select {
            font: inherit; padding: 3px 9px; border: 1px solid #a7a08b; border-radius: 4px;
            background: #e9e4d2; color: #2b2f24; cursor: pointer; }
  #barra button:hover, #tropas button:hover, #topo button:hover { background: #f6f2e4; }
  #barra button.on, #tropas button.on { background: #6f8a3e; border-color: #55702c; color: #f3efe1; }
  #linha { flex: 1; height: 5px; background: #cdc6ae; border-radius: 3px; position: relative; cursor: pointer; }
  #cursor { position: absolute; top: -4px; width: 3px; height: 13px; background: #7c3b2a; border-radius: 2px; }
  #relogio { font-variant-numeric: tabular-nums; min-width: 96px; text-align: right; }

  #topo { left: 12px; top: 12px; display: flex; gap: 6px; padding: 7px 10px; align-items: center; }

  #tropas { left: 12px; top: 58px; width: 234px; max-height: 64vh; overflow: auto; padding: 8px; display: none; }
  #tropas.aberto { display: block; }
  #tropas h4 { margin: 2px 0 6px; font-size: 12px; letter-spacing: .5px; text-transform: uppercase; color: #6a6450; }
  .tropa { display: flex; gap: 8px; align-items: center; padding: 5px 6px; border-radius: 4px; cursor: grab; }
  .tropa:hover { background: #e4dfcc; }
  .tropa canvas { width: 30px; height: 30px; flex: none; }
  .tropa b { font-weight: 600; } .tropa span { color: #6a6450; font-size: 11px; }

  #ficha { right: 12px; top: 12px; width: 212px; padding: 8px 10px; display: none; }
  #ficha.aberto { display: block; }
  #ficha h4 { margin: 0 0 6px; font-size: 13px; }
  #ficha label { display: flex; justify-content: space-between; align-items: center; margin: 4px 0; font-size: 12px; }
  #ficha input[type=range] { width: 108px; }

  #aviso { position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
           background: rgba(147,160,84,.96); font-size: 15px; text-align: center; padding: 40px; }
  .oculto { display: none !important; }
</style>
</head>
<body>
<canvas id="tela"></canvas>

<div id="topo" class="painel">
  <strong>Carentan</strong>
  <select id="selCena"><option value="">cena…</option></select>
  <button id="btTropas" title="u">tropas</button>
  <button id="btRota" title="t">rota</button>
  <button id="btTrajetos" title="h" class="on">trajetos</button>
  <button id="btCam" title="c — a câmera segue as chaves da cena">câmera</button>
  <button id="btLeg" title="l — nomes, objetivos e o relógio da manhã" class="on">legendas</button>
  <button id="btLimpar">limpar</button>
</div>

<div id="tropas" class="painel"><h4>tropas</h4><div id="listaTropas"></div></div>

<div id="ficha" class="painel">
  <h4 id="fichaNome">—</h4>
  <label>tamanho <input type="range" id="fTam" min="4" max="400" step="1"><b id="fTamV"></b></label>
  <label>giro <input type="range" id="fGiro" min="-180" max="180" step="1"><b id="fGiroV"></b></label>
  <label>todos <input type="range" id="fEsc" min="0.2" max="6" step="0.05"><b id="fEscV"></b></label>
  <button id="fApaga">apagar unidade</button>
</div>

<div id="barra" class="painel">
  <button id="btTocar" title="espaço">▶</button>
  <button id="btInicio" title="0">⏮</button>
  <div id="linha"><div id="cursor"></div></div>
  <span id="relogio">0.00 / 0.00 s</span>
</div>

<div id="aviso"></div>

<script type="application/json" id="placas">__PLACAS_JSON__</script>
<script type="application/octet-stream" id="imagens">__SPRITES_JSON__</script>
<script type="application/json" id="malha">__MALHA_JSON__</script>
<script>
/* =====================================================================
   Carentan Studio — o mapa de Carentan como palco, e uma cena como dado.

   Irmão do Globe Studio, com a esfera tirada fora. Aqui o mundo é uma
   PLACA: o PNG que o QGIS rendeu, colado no Mercator pelas coordenadas
   que o carentan.py gravou ao lado dele. Não há globo, não há relevo,
   não há horizonte — há um mapa de 3,18 km de largura e soldados andando
   por cima dele.

   As três regras do repositório valem inteiras:

   1. A EDIÇÃO É DADO. Nenhum tempo, posição ou tiro mora no script: tudo
      na cena JSON (exportCena / loadCena). Quem escreve o JSON escreve o
      filme.

   2. EFEITO É FUNÇÃO PURA DE (SEMENTE, IDADE). Nada acumula entre
      quadros. É isso que faz seek(t) + render() dar sempre o mesmo pixel,
      e é o que sustenta o render quadro a quadro.

   3. TAMANHO É NO CHÃO. O sizeM de uma unidade é a largura dela em
      METROS de terreno — não em pixels de tela. Um pelotão de 18 m tem
      18 m de mapa em qualquer zoom, e é por isso que ele cresce quando a
      câmera desce. A única diferença para o Globe Studio é a unidade:
      lá quilômetros, porque lá cabia um oceano; aqui metros, porque aqui
      cabe uma rua.

   O SISTEMA DE COORDENADAS é o EPSG:3857, em metros de mapa. Duas contas
   moram nisso e vale dizer as duas em voz alta:

   - lon/lat entra e sai em graus, que é como a história está escrita
     ("o entroncamento fica em -1,24963, 49,30085"). O mundo interno é
     3857 porque é nele que a placa é um retângulo alinhado aos eixos, e
     desenhar vira um drawImage e nada mais.
   - um metro de CHÃO não é uma unidade de 3857. O Mercator estica por
     1/cos(lat), que nesta latitude é 1,53. Todo tamanho em metros passa
     por chao() antes de virar geometria; esquecer isso encolheria cada
     soldado em um terço.
   ===================================================================== */
'use strict';

var PLACAS = JSON.parse(document.getElementById('placas').textContent || '[]');
var IMG_B64 = JSON.parse(document.getElementById('imagens').textContent || '{}');

/* =====================================================================
   A RUA

   Duas coisas vêm do `tools/malha.mjs`, e as duas são sobre a mesma
   queixa: uma rota desenhada à mão passa por cima de tudo. O pelotão
   atravessa o quarteirão em diagonal, entra num prédio e sai do outro
   lado — e num mapa onde se lê cada telhado isso é a primeira coisa que
   o olho pega.

   A MALHA é o grafo das ruas de verdade, tirado do OSM: 3680 nós, 4025
   arestas, 99% delas num pedaço só. Um passo de rota com `naRua: true`
   deixa de interpolar entre dois pontos e passa a ANDAR — acha o nó mais
   perto de cada ponto e procura o caminho mais curto por ruas. O pelotão
   dobra a esquina porque a esquina existe, não porque alguém a desenhou.

   O BLOQUEIO é um bit por célula de 3,1 m dizendo onde há prédio. Serve
   à validação, e vale pelo mesmo motivo que "está fora do mapa": é um
   erro que só apareceria no vídeo, quando já custou o render inteiro.
   ===================================================================== */
var MALHA = JSON.parse(document.getElementById('malha').textContent || 'null');
var BLOQ = null;
if (MALHA && MALHA.bloqueio) {
  var bin = atob(MALHA.bloqueio.bits);
  BLOQ = new Uint8Array(bin.length);
  for (var bi = 0; bi < bin.length; bi++) BLOQ[bi] = bin.charCodeAt(bi);
}
/* metros por grau, na latitude do mapa. Não é constante no globo, mas num
   recorte de 3 km a variação é de centésimos e a conta fica uma conta. */
var M_LON = 72670, M_LAT = 111132;
function metrosEntre(a, b) { return Math.hypot((a[0] - b[0]) * M_LON, (a[1] - b[1]) * M_LAT); }

function bloqueado(lon, lat) {
  if (!BLOQ) return false;
  var B = MALHA.bloqueio, L = MALHA.limites;
  var cx = Math.floor((lon - L.oeste) / (L.leste - L.oeste) * B.largura);
  var cy = Math.floor((lat - L.sul) / (L.norte - L.sul) * B.altura);
  if (cx < 0 || cy < 0 || cx >= B.largura || cy >= B.altura) return false;
  var k = cy * B.largura + cx;
  return !!(BLOQ[k >> 3] & (1 << (k & 7)));
}

/* O índice da malha, montado uma vez. A busca do nó mais perto é linear
   nos 3680 nós e roda uma vez por ponto de rota, não por quadro — não
   vale uma árvore. */
var RUA = null;
function malhaPronta() {
  if (RUA || !MALHA || !MALHA.nos) return RUA;
  var n = MALHA.nos.length / 2, viz = [];
  for (var i = 0; i < n; i++) viz.push([]);
  for (var e = 0; e < MALHA.arestas.length; e += 3) {
    var a = MALHA.arestas[e], b = MALHA.arestas[e + 1], d = MALHA.arestas[e + 2];
    viz[a].push([b, d]); viz[b].push([a, d]);
  }
  RUA = { n: n, viz: viz, xy: function (i) { return [MALHA.nos[i * 2], MALHA.nos[i * 2 + 1]]; } };
  return RUA;
}
function noMaisPerto(lon, lat) {
  var g = malhaPronta(); if (!g) return -1;
  var melhor = -1, dd = Infinity;
  for (var i = 0; i < g.n; i++) {
    var dx = (MALHA.nos[i * 2] - lon) * M_LON, dy = (MALHA.nos[i * 2 + 1] - lat) * M_LAT;
    var d = dx * dx + dy * dy;
    if (d < dd) { dd = d; melhor = i; }
  }
  return melhor;
}

/* A* com heurística de linha reta em metros. Admissível (a reta nunca é
   mais longa que o caminho), então o primeiro que sai é o mais curto. */
function caminhoDeRua(deLon, deLat, paraLon, paraLat) {
  var g = malhaPronta(); if (!g) return null;
  var ini = noMaisPerto(deLon, deLat), fim = noMaisPerto(paraLon, paraLat);
  if (ini < 0 || fim < 0) return null;
  return caminhoDeNos(ini, fim);
}
function caminhoDeNos(ini, fim) {
  var g = malhaPronta(); if (!g) return null;
  if (ini === fim) return [g.xy(ini)];
  var custo = new Float64Array(g.n).fill(Infinity);
  var veio = new Int32Array(g.n).fill(-1);
  var fechado = new Uint8Array(g.n);
  var alvo = g.xy(fim);
  var fila = [[metrosEntre(g.xy(ini), alvo), ini]];
  custo[ini] = 0;
  while (fila.length) {
    /* fila por varredura: com 3680 nós o heap não paga o código que custa */
    var melhor = 0;
    for (var q = 1; q < fila.length; q++) if (fila[q][0] < fila[melhor][0]) melhor = q;
    var u = fila.splice(melhor, 1)[0][1];
    if (u === fim) break;
    if (fechado[u]) continue;
    fechado[u] = 1;
    var vs = g.viz[u];
    for (var k = 0; k < vs.length; k++) {
      var v = vs[k][0], novo = custo[u] + vs[k][1];
      if (novo < custo[v]) {
        custo[v] = novo; veio[v] = u;
        fila.push([novo + metrosEntre(g.xy(v), alvo), v]);
      }
    }
  }
  if (custo[fim] === Infinity) return null;        // dois pedaços do grafo
  var saida = [], c = fim;
  while (c !== -1) { saida.push(g.xy(c)); c = veio[c]; }
  return saida.reverse();
}

/* Os pontos do passo, expandidos pela rua.
   As pontas ficam: o primeiro e o último ponto que a cena escreveu são
   respeitados, e só o MIOLO vira caminho de rua. Assim uma unidade pode
   sair de dentro de um quintal, andar pela rua e parar noutro quintal —
   forçar as pontas para o nó mais próximo teleportaria os dois extremos
   para a esquina mais perto. */
/* Os pontos do passo, expandidos pela rua.

   A PRIMEIRA VERSÃO CONCATENAVA UM A* POR PAR de coordenadas e emendava
   as coordenadas escritas à mão entre um e outro. Medido num caminho que
   devia ter 250 m: saiu com 703 m, com um esporão de ida-e-volta de
   trinta metros no meio — e um esporão é uma inversão de 180 graus no
   rumo, que era o pião que sobrou.

   A causa é a emenda. Dois A* vizinhos terminam e começam em NÓS
   DIFERENTES (cada um busca o nó mais perto da sua ponta), e o ponto
   escrito à mão no meio, que quase nunca cai na pista, puxa o caminho
   para fora e o traz de volta.

   Agora o caminho é feito SÓ DE NÓS DO GRAFO: cada coordenada vira um nó,
   e os trechos entre nós consecutivos se emendam no MESMO nó, exatamente.
   As duas pontas escritas à mão voltam no fim, para a unidade poder sair
   de um quintal e parar noutro — mas o miolo é rua, e só rua. */
function pontosPelaRua(r) {
  if (r._rua) return r._rua;
  var g = malhaPronta(), P = r.points;
  if (!g) { r._rua = P; return P; }

  var nos = [];
  for (var i = 0; i < P.length; i++) {
    var n = noMaisPerto(P[i][0], P[i][1]);
    if (n >= 0 && (!nos.length || nos[nos.length - 1] !== n)) nos.push(n);
  }
  if (nos.length < 2) { r._rua = P; return P; }

  var cam = [g.xy(nos[0])];
  for (var k = 0; k < nos.length - 1; k++) {
    var t = caminhoDeNos(nos[k], nos[k + 1]);
    if (!t) continue;
    for (var j = 1; j < t.length; j++) cam.push(t[j]);   // o 0 é o nó que já está lá
  }

  /* CORTA A RÉ DAS DUAS PONTAS.
     O nó mais perto da partida pode estar ATRÁS dela na rua, e o mais
     perto da chegada pode estar ADIANTE: no primeiro caso a unidade dá
     um passo para trás antes de sair, no segundo ela passa do ponto e
     volta. Meio segundo de marcha a ré, que com o rumo olhando dez
     metros à frente vira meia-volta completa — e, num passo que continua
     o anterior, vira um pião na emenda.

     O teste é o produto escalar com a direção pretendida pelo autor: um
     nó que está para trás dela é ré, e sai. */
  function paraFrente(v, d) { return v[0] * d[0] + v[1] * d[1] >= 0; }
  var ult = P[P.length - 1], penul = P[P.length - 2] || P[0];
  var rumoIni = [P[1][0] - P[0][0], P[1][1] - P[0][1]];
  var rumoFim = [ult[0] - penul[0], ult[1] - penul[1]];
  var corte = 0, fimCorte = cam.length;
  while (corte < cam.length - 1 && !paraFrente([cam[corte][0] - P[0][0], cam[corte][1] - P[0][1]], rumoIni)) corte++;
  while (fimCorte > corte + 1 && paraFrente([cam[fimCorte - 1][0] - ult[0], cam[fimCorte - 1][1] - ult[1]], rumoFim)) fimCorte--;
  /* O CORTE NÃO PODE COMER O CAMINHO INTEIRO.
     Quando as duas pontas se encontram — e encontram, numa rota curta ou
     numa em que o miolo faz curva para trás — a fatia sai VAZIA, e aí o
     que resta é partida e chegada: uma reta atravessando o quarteirão, com
     o pelotão marchando por cima dos telhados. Foi o que apareceu no fim
     da prova. Cortar é um ajuste de ponta; se ele consome mais que um
     terço dos nós, o palpite está errado e o caminho inteiro vale mais que
     o ajuste. */
  if (fimCorte - corte >= Math.max(2, cam.length * 0.67)) cam = cam.slice(corte, fimCorte);

  /* TIRA OS ESPORÕES. Se o vizinho de trás e o da frente estão quase no
     mesmo lugar, o ponto do meio é uma ida-e-volta: some com ele. Repete
     até não sobrar nenhum, porque tirar um pode revelar o seguinte. */
  var mexeu = true, voltas = 0;
  while (mexeu && voltas++ < 8) {
    mexeu = false;
    for (var s = 1; s < cam.length - 1; s++) {
      if (metrosEntre(cam[s - 1], cam[s + 1]) < 6) { cam.splice(s, 1); mexeu = true; s--; }
    }
  }

  var saida = [P[0]];
  for (var q = 0; q < cam.length; q++)
    if (metrosEntre(cam[q], saida[saida.length - 1]) > 3) saida.push(cam[q]);
  var fim = P[P.length - 1];
  if (metrosEntre(fim, saida[saida.length - 1]) > 3) saida.push(fim);

  r._rua = saida.length > 1 ? saida : P;
  return r._rua;
}

/* ---------------- Mercator ---------------- */
var R = 6378137.0, GR = Math.PI / 180;
function mx(lon) { return lon * GR * R; }
function my(lat) {
  var s = Math.sin(lat * GR);
  if (s > 0.9999) s = 0.9999; if (s < -0.9999) s = -0.9999;
  return R / 2 * Math.log((1 + s) / (1 - s));
}
function lonDe(x) { return x / R / GR; }
function latDe(y) { return (2 * Math.atan(Math.exp(y / R)) - Math.PI / 2) / GR; }
/* metros de chão -> unidades de mapa, na latitude dada */
function chao(m, lat) { return m / Math.cos(lat * GR); }

/* ---------------- a tela ---------------- */
var TELA = document.getElementById('tela'), ctx = TELA.getContext('2d', { alpha: false });
var CW = 0, CH = 0, DPR = 1;
function redimensiona() {
  DPR = window.devicePixelRatio || 1;
  CW = Math.max(2, Math.round(TELA.clientWidth * DPR));
  CH = Math.max(2, Math.round(TELA.clientHeight * DPR));
  TELA.width = CW; TELA.height = CH;
  desenha();
}
window.addEventListener('resize', redimensiona);

/* ---------------- a câmera ----------------
   x, y no mundo (3857) e w = a largura visível, também em unidades de
   mapa. A escala é a mesma nos dois eixos; y cresce para cima no mundo e
   para baixo na tela, e é só aí que o sinal vira. */
var cam = { x: 0, y: 0, w: 1000 };
function k() { return CW / cam.w; }
function paraTelaXY(X, Y) { var e = k(); return [(X - cam.x) * e + CW / 2, CH / 2 - (Y - cam.y) * e]; }
function paraTela(lon, lat) { return paraTelaXY(mx(lon), my(lat)); }
function doMundo(sx, sy) { var e = k(); return [cam.x + (sx - CW / 2) / e, cam.y - (sy - CH / 2) / e]; }

/* a câmera na cena é lon/lat e LARGURA VISÍVEL EM METROS DE CHÃO. Não é
   capricho de unidade: "a câmera enxerga 700 m" é uma frase que se
   confere olhando o mapa, e um fator de zoom não é. */
function poeCamera(lon, lat, larguraM) {
  cam.x = mx(lon); cam.y = my(lat);
  if (larguraM > 0) cam.w = chao(larguraM, lat);
}
function cameraAtual() {
  var lat = latDe(cam.y);
  return { lon: +lonDe(cam.x).toFixed(6), lat: +lat.toFixed(6),
           larguraM: Math.round(cam.w * Math.cos(lat * GR)) };
}

/* ---------------- as placas ----------------
   Cada placa é o mesmo mapa rendido num recorte e numa resolução. A
   escolha é por quadro: a mais fina que CABE inteira no que a câmera vê.
   Desenhar as duas empilhadas seria mais suave, mas as texturas do QGIS
   estão em milímetros de TELA e mudam de escala entre um recorte e
   outro — a emenda apareceria como um degrau de granulação no meio do
   campo. Uma placa por quadro, e a cena pode fixar qual em camera.placa. */
var IMAGENS = {}, prontas = 0;
function carregaImagem(nome, b64, mime, aoFim) {
  var im = new Image();
  im.onload = function () { IMAGENS[nome] = im; prontas++; aoFim && aoFim(); };
  im.onerror = function () { prontas++; aoFim && aoFim(); };
  im.src = 'data:' + (mime || 'image/png') + ';base64,' + b64;
}
function placaPara(nome) {
  if (nome) { for (var j = 0; j < PLACAS.length; j++) if (PLACAS[j].nome === nome) return PLACAS[j]; }
  var v = retanguloVisivel(), melhor = null;
  for (var i = 0; i < PLACAS.length; i++) {
    var p = PLACAS[i], e = p.extensao3857;
    if (e[0] <= v[0] && e[1] <= v[1] && e[2] >= v[2] && e[3] >= v[3]) {
      if (!melhor || (e[2] - e[0]) < (melhor.extensao3857[2] - melhor.extensao3857[0])) melhor = p;
    }
  }
  if (melhor) return melhor;
  var maior = PLACAS[0];                       // nada cobre: a mais larga que houver
  for (var m = 1; m < PLACAS.length; m++)
    if (PLACAS[m].extensao3857[2] - PLACAS[m].extensao3857[0] >
        maior.extensao3857[2] - maior.extensao3857[0]) maior = PLACAS[m];
  return maior;
}
function retanguloVisivel() {
  var meiaW = cam.w / 2, meiaH = cam.w * CH / CW / 2;
  return [cam.x - meiaW, cam.y - meiaH, cam.x + meiaW, cam.y + meiaH];
}

/* =====================================================================
   O CATÁLOGO
   Tipos de unidade, não unidades. Um tipo diz o que a coisa é e com o
   que ela atira; a cena diz onde ela está e quando. Trocar o desenho de
   um tipo não mexe em nenhum tempo de nenhuma cena.
   ===================================================================== */
/* `imgEspera` é o desenho do homem PARADO, e é o par de `img`. O motor
   troca de um para o outro quando o relógio cai num passo de espera —
   então o pelotão que sobe a estrada em pé é o mesmo que fica de bruços
   na vala durante os quarenta segundos em que a narração fala de outra
   coisa. Um campo, e a cena não precisa saber que existem duas imagens.

   `sizeM` é a largura da figura NO CHÃO. Para um grupo, é a pegada
   nominal do conjunto: cada homem sai com uma fração dela (veja
   desenhaUnidade), e quem manda na extensão da coluna é o espalhoM do
   grupo. Os números aqui são maiores que um homem de verdade de

/* O RUMO SAI DO TEMPO, E NÃO DA CURVA.

   mapa de videogame. Mas trinta unidades independentes na cena JSON são
   trinta rotas para escrever e trinta para corrigir quando o tempo muda.

   volta do ponto dela. A formação é calculada no referencial da unidade
   — +y é para onde ela vai, +x é a direita dela — e depois girada pelo
   rumo, então a coluna vira junto na esquina, como coluna de verdade.

      pilula(m.texto, s[0], s[1], { centro: true, tam: m.tam || 12 });
    }
    ctx.restore();
  }
}

function desenhaRotulos(baixas) {
  for (var i = 0; i < UNIDADES.length; i++) {
    var u = UNIDADES[i];
    if (!u.rotulo || !u.on) continue;
    /* a etiqueta morre com a unidade. Sem isto "MG 42 — Bar du Stade"
       continua flutuando sobre a esquina meio minuto depois de a granada
       ter calado a metralhadora, e o mapa passa a mentir por escrito. */
    var morta = baixas[u.id];
    if (morta !== undefined && T >= morta) continue;
    var a = visibilidade(u, T);
    if (a <= 0.002) continue;
    var s = paraTela(u._l, u._t);
    if (s[0] < -240 || s[0] > CW + 240 || s[1] < -140 || s[1] > CH + 140) continue;
    var tipo = tipoPorId(u.type);
    /* branco dos dois lados, como na referencia; quem diz o lado e o
       proprio sprite, nao a cor da letra. O eixo ganha so um contorno
       mais quente, que se le sem virar legenda colorida. */
    var cont = tipo && tipo.lado === 'eixo' ? 'rgba(52,16,10,.90)' : 'rgba(16,18,14,.88)';
    ctx.save(); ctx.globalAlpha = a;
    var cx = pilula(u.rotulo, s[0], s[1] - 42 * DPR, { centro: true, tam: 13, contorno: cont });
    haste(cx, s[0], s[1]);
    ctx.restore();
  }
}

/* O relógio da HISTÓRIA, não o do filme.
   A barra embaixo conta segundos de vídeo; isto conta a manhã. Sem ele,
   "às 6h lançam o ataque" e "às 7h fazem a ligação" são duas frases da
   narração sem nada no mapa que as confirme. A conta é o tempo de cena
   vezes a compressão declarada — o mesmo número que a validação usa para
   saber se um pelotão está andando rápido demais. Um número só, servindo
   para as duas coisas, é um número que não pode ficar desatualizado. */
function desenhaRelogio() {
  if (RELOGIO_INICIO === null) return;
  var seg = RELOGIO_INICIO + T * ESCALA_TEMPO;
  var h = Math.floor(seg / 3600) % 24, m = Math.floor(seg / 60) % 60;
  var txt = (h < 10 ? '0' : '') + h + 'h' + (m < 10 ? '0' : '') + m;
  ctx.save();
  var w = larguraVersalete(versalete('00h00'), 22 * DPR * 1.15);
  pilula(txt, CW - 26 * DPR - w, 38 * DPR, { tam: 22, fixa: true });
  ctx.restore();
}

function desenha() {
  if (!CW) return;
  desenhaPlaca(CENA_PLACA);
  if (AJUDAS) desenhaTrajetos();
  var baixas = mapaDeBaixas();
  for (var i = 0; i < UNIDADES.length; i++) desenhaUnidade(UNIDADES[i], baixas);
  desenhaTiros();
  if (LEGENDAS) { CAIXAS.length = 0; desenhaMarcos(); desenhaRotulos(baixas); desenhaRelogio(); }
}
var CENA_PLACA = null;

/* =====================================================================
   A CENA, COMO DADO
   ===================================================================== */
function objetoDaCena() {
  var camera;
  if (CAM_CHAVES.length) {
    /* uma cena com chaves EXPORTA AS CHAVES, não o instante em que o
       relógio parou. Exportar a câmera calculada destruiria o movimento:
       reabrir a cena daria uma câmera parada no segundo em que se salvou */
    camera = { chaves: CAM_CHAVES.map(function (c) {
      var o = { t: +(+c.t).toFixed(2), lon: +(+c.lon).toFixed(6), lat: +(+c.lat).toFixed(6),
                larguraM: Math.round(c.larguraM) };
      if (c.corte) o.corte = true;
      if (c.suave === false) o.suave = false;
      if (c.placa) o.placa = c.placa;
      return o;
    }) };
  } else {
    camera = cameraAtual();
    if (CENA_PLACA) camera.placa = CENA_PLACA;
  }
  var cena = { camera: camera, time: +T.toFixed(3), scale: ESCALA };
  if (DURACAO_CENA) cena.duracao = DURACAO_CENA;
  if (ESCALA_TEMPO !== 1) cena.escalaDoTempo = ESCALA_TEMPO;
  if (RELOGIO_INICIO !== null) cena.relogio = hhmm(RELOGIO_INICIO);
  if (MARCOS.length) cena.marcos = JSON.parse(JSON.stringify(MARCOS));
  cena.sprites = UNIDADES.map(function (u) {
    var d = { id: u.id, type: u.type, img: u.img,
              lon: +u._l.toFixed(6), lat: +u._t.toFixed(6),
              heading: +u.heading.toFixed(1), sizeM: u.sizeM };
    if (u.imgEspera) d.imgEspera = u.imgEspera;
    if (u.rotulo) d.rotulo = u.rotulo;
    if (u.spin) d.spin = +u.spin.toFixed(1);
    if (u.opacity !== 1) d.opacity = u.opacity;
    if (u.minPx) d.minPx = u.minPx;
    if (!u.on) d.on = false;
    if (u.entra !== null) d.entra = u.entra;
    if (u.sai !== null) d.sai = u.sai;
    if (u.grupo) d.grupo = { n: u.grupo.n, espalhoM: u.grupo.espalhoM, homemM: u.grupo.homemM,
                             formacao: u.grupo.formacao, semente: u.grupo.semente };
    var P = pernas(u);
    if (P.length) {
      var saida = P.map(function (r) {
        var o = {};
        if (r.esperar > 0) { o.esperar = r.esperar; }
        else {
          o.points = r.points.map(function (p) { return [+p[0].toFixed(6), +p[1].toFixed(6)]; });
          if (r.duration) o.duration = r.duration;
          if (r.speedKmh) o.speedKmh = r.speedKmh;
          if (r.loop) o.loop = true;
          if (r.naRua) o.naRua = true;
        }
        if (r.start !== null) o.start = r.start;
        return o;
      });
      d.route = saida.length === 1 ? saida[0] : saida;   // um passo só sai como objeto
    }
    if (u.shots && u.shots.length) d.shots = JSON.parse(JSON.stringify(u.shots));
    return d;
  });
  return cena;
}

/* A validação. Roda em milissegundos e reprova a cena antes de qualquer
   pixel: é ela que deixa conferir o filme sem assistir ao filme. */
function validaCena(sc) {
  if (typeof sc === 'string') sc = JSON.parse(sc);
  var erros = [], avisos = [], ids = {}, lista = (sc && sc.sprites) || [];
  var esc = (sc && sc.escalaDoTempo > 0) ? +sc.escalaDoTempo : 1;
  /* Os ids TODOS antes de checar qualquer um.
     Montar este conjunto dentro do mesmo laço que valida fazia o alvo de
     um tiro parecer inexistente só por estar mais abaixo no arquivo — e
     aí o aviso que existe para pegar um id digitado errado passava a
     aparecer doze vezes numa cena correta, que é o mesmo que não existir. */
  var conhecidos = {};
  for (var z0 = 0; z0 < lista.length; z0++) if (lista[z0].id) conhecidos[lista[z0].id] = true;
  var lim = PLACAS.length ? PLACAS[0].limites : null;
  for (var i = 0; i < PLACAS.length; i++) {
    var L = PLACAS[i].limites;
    lim = { oeste: Math.min(lim.oeste, L.oeste), leste: Math.max(lim.leste, L.leste),
            sul: Math.min(lim.sul, L.sul), norte: Math.max(lim.norte, L.norte) };
  }
  function foraDoMapa(lon, lat) {
    return lim && (lon < lim.oeste || lon > lim.leste || lat < lim.sul || lat > lim.norte);
  }
  for (var a = 0; a < lista.length; a++) {
    var s = lista[a], quem = s.id || a;
    if (!s.id) erros.push('unidade ' + a + ': sem id');
    else if (ids[s.id]) erros.push('id repetido "' + s.id + '"');
    ids[s.id] = true;
    if (s.type && !tipoPorId(s.type)) avisos.push(quem + ': tipo "' + s.type + '" não está no catálogo');
    if (s.img && !IMAGENS[s.img]) avisos.push(quem + ': a imagem "' + s.img + '" não está neste arquivo (vai de ficha)');
    if (!(s.sizeM > 0) && !(s.type && tipoPorId(s.type))) avisos.push(quem + ': sem sizeM e sem tipo');
    /* o erro que só apareceria no vídeo: a unidade está fora da placa e
       o quadro sai vazio sem ninguém entender por quê */
    if (s.lon !== undefined && foraDoMapa(+s.lon, +s.lat))
      erros.push(quem + ': está fora do mapa (' + s.lon + ', ' + s.lat + ')');
    if (s.imgEspera && !IMAGENS[s.imgEspera])
      avisos.push(quem + ': a imagem de espera "' + s.imgEspera + '" não está neste arquivo');
    if (s.grupo) {
      if (!(s.grupo.n > 0)) erros.push(quem + ': grupo sem n');
      else if (s.grupo.n > 60) avisos.push(quem + ': grupo de ' + s.grupo.n + ' — acima de 60 o desenho custa e ninguém conta');
      if (s.grupo.formacao && ['coluna', 'linha', 'cunha', 'nuvem'].indexOf(s.grupo.formacao) < 0)
        avisos.push(quem + ': formação "' + s.grupo.formacao + '" não existe — vai de coluna');
    }
    if (s.entra !== undefined && s.sai !== undefined && +s.sai <= +s.entra)
      erros.push(quem + ': sai (' + s.sai + ') não é depois de entra (' + s.entra + ')');

    var P = !s.route ? [] : (Array.isArray(s.route) ? s.route : [s.route]);
    var n = 0, fimAnterior = null, relogio = 0, fimAnteriorT = null;
    for (var g = 0; g < P.length; g++) {
      var r = P[g], pts = r.points || [], espera = !!(r.esperar > 0);
      var rotulo = P.length > 1 ? (' do passo ' + (g + 1)) : ' da rota';
      if (r.start !== undefined && r.start !== null) {
        if (fimAnteriorT !== null && +r.start < fimAnteriorT - 1e-6)
          erros.push(quem + ': o passo ' + (g + 1) + ' tem start ' + r.start +
                     ' mas o anterior só acaba em ' + fimAnteriorT.toFixed(1) + ' s');
        relogio = +r.start;
      }
      if (espera) {
        if (pts.length) avisos.push(quem + ': o passo ' + (g + 1) + ' tem esperar E pontos — os pontos são ignorados');
        relogio += +r.esperar;
        fimAnteriorT = relogio;
        continue;
      }
      if (!pts.length) { avisos.push(quem + ': o passo ' + (g + 1) + ' não anda nem espera'); continue; }
      for (var w = 0; w < pts.length; w++)
        if (foraDoMapa(pts[w][0], pts[w][1]))
          erros.push(quem + ': o ponto ' + w + rotulo + ' está fora do mapa');
      if (pts.length === 1) avisos.push(quem + ': passo com um ponto só não move nada');
      if (pts.length > 1 && !(r.duration > 0) && !(r.speedKmh > 0))
        avisos.push(quem + ':' + rotulo + ' sem duration nem speedKmh — vai durar 1 s');
      /* o erro que teleporta a unidade: o passo seguinte começa longe de
         onde o anterior parou, e no vídeo o pelotão pula a rua inteira num
         quadro. 25 m é a folga de quem digitou a coordenada de novo. */
      if (fimAnterior && pts.length) {
        var d = Math.hypot((pts[0][0] - fimAnterior[0]) * 72670, (pts[0][1] - fimAnterior[1]) * 111132);
        if (d > 25) avisos.push(quem + ': o passo ' + (g + 1) + ' começa a ' + Math.round(d) +
                                ' m de onde o anterior parou — a unidade vai saltar');
      }
      /* a velocidade que denuncia o tempo errado: 25 km/h é corrida de
         cavalo, e paraquedista carregado faz 4 a 6 km/h. Quase sempre é
         duration pequeno demais, não a rota */
      var dur = r.duration > 0 ? +r.duration : null;
      if (dur && pts.length > 1) {
        var met = 0;
        for (var q = 1; q < pts.length; q++)
          met += Math.hypot((pts[q][0] - pts[q - 1][0]) * 72670, (pts[q][1] - pts[q - 1][1]) * 111132);
        /* a velocidade que importa é a da HISTÓRIA, não a da tela: o
           filme comprime, e comparar a velocidade de tela com a de um
           homem a pé reclamaria de todas as pernas de toda cena
           comprimida, o que é o mesmo que não reclamar de nenhuma */
        var kmh = met / dur * 3.6 / esc;
        if (kmh > 15) avisos.push(quem + ': o passo ' + (g + 1) + ' sai a ' + kmh.toFixed(1) +
                                  ' km/h de verdade (' + Math.round(met) + ' m em ' + dur +
                                  ' s de filme x' + esc + ') — infantaria faz 4 a 6');
        else if (kmh < 0.8 && met > 30) avisos.push(quem + ': o passo ' + (g + 1) + ' sai a ' + kmh.toFixed(1) +
                                  ' km/h de verdade — mais devagar que andar, confira a duração');
      }
      /* O TRECHO QUE ATRAVESSA PRÉDIO.
         Amostra o caminho de 3 em 3 metros e mede a maior corrida CONTÍNUA
         de amostras dentro de parede. A corrida é o que separa os dois
         casos: raspar a quina de uma casa dá uma ou duas células e é o que
         acontece em qualquer rua estreita; atravessar a casa dá dez ou
         vinte seguidas. Contar o total confundiria os dois. */
      if (BLOQ && pts.length > 1) {
        var linha = r.naRua ? pontosPelaRua(clonaPasso(r)) : pts;
        var corrida = 0, pior = 0, ondeX = 0, ondeY = 0;
        for (var c1 = 0; c1 < linha.length - 1; c1++) {
          var aa = linha[c1], bb = linha[c1 + 1];
          var comp = Math.hypot((bb[0] - aa[0]) * 72670, (bb[1] - aa[1]) * 111132);
          var passos = Math.max(1, Math.ceil(comp / 3));
          for (var c2 = 0; c2 <= passos; c2++) {
            var u2 = c2 / passos;
            var lo = aa[0] + (bb[0] - aa[0]) * u2, la = aa[1] + (bb[1] - aa[1]) * u2;
            if (bloqueado(lo, la)) {
              corrida += 3;
              if (corrida > pior) { pior = corrida; ondeX = lo; ondeY = la; }
            } else corrida = 0;
          }
        }
        /* UM CAMINHO DE RUA NÃO PODE SER REPROVADO PELA MÁSCARA.
           Ele é, por construção, o eixo de uma via que o OSM diz existir; se
           ele encosta em parede é porque numa cidade normanda a casa dá para a
           calçada e a célula de 3,1 m não sabe separar as duas. Reprovar aqui
           seria a validação discutindo com o próprio dado. Fica como nota,
           porque ainda diz onde a rua é estreita.

           A reprovação vale para o traçado à MÃO, que é onde o atalho por
           dentro do quarteirão realmente acontece. */
        /* UM naRua QUE VIROU RETA NÃO É UM naRua.
           Quando o A* não fecha — as duas pontas em pedaços diferentes do
           grafo, ou o corte de ponta comendo o caminho — o passo cai de
           volta nas coordenadas cruas, em silêncio, e vira uma reta
           atravessando o quarteirão. Como passo de rua é só anotado e não
           reprovado, o silêncio passava direto. Se a expansão devolveu o
           mesmo número de pontos que entrou, não houve rua nenhuma. */
        var virouReta = r.naRua && linha.length <= pts.length;
        if (virouReta && pior >= 9)
          erros.push(quem + ': o passo ' + (g + 1) + ' pede naRua mas caiu em RETA e ' +
                     'atravessa ' + pior + ' m de prédio em ' + ondeX.toFixed(5) + ',' +
                     ondeY.toFixed(5) + ' — as pontas podem estar longe da malha');
        else if (pior >= 9) {
          var onde = ' em ' + ondeX.toFixed(5) + ',' + ondeY.toFixed(5);
          if (r.naRua)
            avisos.push(quem + ': o passo ' + (g + 1) + ' passa rente a ' + pior +
                        ' m de fachada' + onde + ' — é rua estreita, não atalho');
          else if (pior >= 20)
            erros.push(quem + ': o passo ' + (g + 1) + ' atravessa ' + pior +
                       ' m de prédio' + onde + ' — experimente naRua: true');
          else
            avisos.push(quem + ': o passo ' + (g + 1) + ' raspa ' + pior + ' m de prédio' + onde);
        }
      }
      if (pts.length) fimAnterior = pts[pts.length - 1];
      relogio += dur || 1;
      fimAnteriorT = relogio;
      n += pts.length;
    }
    for (var j = 0; s.shots && j < s.shots.length; j++) {
      var sh = s.shots[j];
      if (sh.t === undefined && sh.at === undefined) erros.push(quem + ' tiro ' + j + ': sem at nem t');
      if (sh.at !== undefined && (sh.at < 0 || sh.at >= Math.max(1, n)))
        erros.push(quem + ' tiro ' + j + ': at ' + sh.at + ' fora da rota (' + n + ' pontos)');
      if (!sh.target && !sh.toward) erros.push(quem + ' tiro ' + j + ': sem target nem toward');
      if (sh.target && !conhecidos[sh.target] && !unidadePorId(sh.target))
        avisos.push(quem + ' tiro ' + j + ': o alvo "' + sh.target + '" não está na cena');
      if (s.type && !(tipoPorId(s.type) && tipoPorId(s.type).arma))
        avisos.push(quem + ': atira, mas o tipo não tem arma');
    }
  }
  var M = (sc && sc.marcos) || [];
  for (var q2 = 0; q2 < M.length; q2++) {
    if (foraDoMapa(+M[q2].lon, +M[q2].lat))
      erros.push('marco ' + q2 + ' ("' + (M[q2].texto || '') + '"): está fora do mapa');
    if (M[q2].tipo && ['lugar', 'objetivo'].indexOf(M[q2].tipo) < 0)
      avisos.push('marco ' + q2 + ': tipo "' + M[q2].tipo + '" não existe — vai de lugar');
  }
  if (sc && sc.relogio && segundosDe(sc.relogio) === null)
    erros.push('relogio: "' + sc.relogio + '" não é uma hora (use "06:00")');

  /* a câmera também é dado, e também erra */
  var K = (sc && sc.camera && sc.camera.chaves) || [];
  for (var c = 0; c < K.length; c++) {
    var ch = K[c];
    if (!(ch.t >= 0)) erros.push('câmera ' + c + ': sem t');
    if (c > 0 && ch.t <= K[c - 1].t) erros.push('câmera ' + c + ': t ' + ch.t + ' não é depois da chave anterior');
    if (foraDoMapa(+ch.lon, +ch.lat)) erros.push('câmera ' + c + ': olha para fora do mapa');
    if (!(ch.larguraM > 0)) erros.push('câmera ' + c + ': sem larguraM');
    else if (ch.larguraM < 60) avisos.push('câmera ' + c + ': ' + ch.larguraM + ' m é zoom de mais que a placa aguenta (0,27 m/px)');
    else if (ch.larguraM > 3180) avisos.push('câmera ' + c + ': ' + ch.larguraM + ' m é mais largo que a placa (3180 m) — vai sobrar fundo');
    /* o enjoo: uma viagem longa num tempo curto vira chicote na tela */
    if (c > 0) {
      var ant = K[c - 1], dt = ch.t - ant.t;
      var metros = Math.hypot((ch.lon - ant.lon) * 72670, (ch.lat - ant.lat) * 111132);
      if (dt > 0 && !ch.corte && metros / dt > 260)
        avisos.push('câmera ' + c + ': anda ' + Math.round(metros) + ' m em ' + dt.toFixed(1) +
                    ' s — rápido demais; use corte:true ou dê mais tempo');
    }
  }
  return { ok: !erros.length, errors: erros, warnings: avisos };
}

function loadCena(sc) {
  if (typeof sc === 'string') sc = JSON.parse(sc);
  pausa();
  if (sc.sprites) {
    UNIDADES.length = 0;
    for (var i = 0; i < sc.sprites.length; i++) UNIDADES.push(fazUnidade(sc.sprites[i]));
    selecionada = null;
  }
  DURACAO_CENA = sc.duracao > 0 ? +sc.duracao : 0;
  ESCALA_TEMPO = sc.escalaDoTempo > 0 ? +sc.escalaDoTempo : 1;
  RELOGIO_INICIO = sc.relogio ? segundosDe(sc.relogio) : null;
  MARCOS = (sc.marcos || []).map(function (m) {
    return { lon: +m.lon, lat: +m.lat, texto: m.texto || '', tipo: m.tipo || 'lugar',
             entra: m.entra === undefined ? null : +m.entra,
             sai: m.sai === undefined ? null : +m.sai,
             tomado: m.tomado === undefined ? null : +m.tomado,
             tam: m.tam, cor: m.cor };
  });
  CAM_CHAVES = [];
  if (sc.camera) {
    if (sc.camera.chaves && sc.camera.chaves.length) {
      CAM_CHAVES = sc.camera.chaves.map(function (c) {
        return { t: +c.t || 0, lon: +c.lon, lat: +c.lat, larguraM: +c.larguraM,
                 corte: !!c.corte, suave: c.suave, placa: c.placa || null };
      }).sort(function (a, b) { return a.t - b.t; });
      CAM_PRESA = true;
    } else {
      CENA_PLACA = sc.camera.placa || null;
      poeCamera(sc.camera.lon !== undefined ? +sc.camera.lon : lonDe(cam.x),
                sc.camera.lat !== undefined ? +sc.camera.lat : latDe(cam.y),
                sc.camera.larguraM);
    }
  }
  if (sc.scale > 0) ESCALA = +sc.scale;
  var chk = validaCena(sc);
  if (!chk.ok) console.warn('loadCena: ' + chk.errors.join('; '));
  else if (chk.warnings.length) console.info('loadCena: ' + chk.warnings.join('; '));
  sincronizaCamBotao();
  seek(sc.time || 0);
  sincronizaFicha();
  desenha();
  return true;
}

/* ---------------- cenas prontas ----------------
   JSON puro, da mesma forma que loadCena aceita e exportCena devolve —
   uma cena montada na tela pode ser colada aqui, e uma cena escrita aqui
   pode ser aberta, editada e exportada. */
var CENAS = __CENAS_JSON__;
function cena(nome) {
  if (nome === 'limpar') {
    UNIDADES.length = 0; MARCOS = []; CAM_CHAVES = []; RELOGIO_INICIO = null;
    selecionada = null; sincronizaCamBotao(); seek(0); desenha(); return true;
  }
  var c = CENAS[nome];
  if (!c) return false;
  return loadCena(JSON.parse(JSON.stringify(c)));
}

  TELA.classList.add('arrastando');
});
window.addEventListener('mousemove', function (e) {
  if (!arrastando) return;
  var dx = (e.clientX - arrastouX) * DPR, dy = (e.clientY - arrastouY) * DPR;
  if (Math.abs(dx) + Math.abs(dy) > 3) { moveu = true; soltaCamera(); }
  cam.x -= dx / k(); cam.y += dy / k();
  arrastouX = e.clientX; arrastouY = e.clientY;
  desenha();
});
window.addEventListener('mouseup', function () { arrastando = false; TELA.classList.remove('arrastando'); });

TELA.addEventListener('wheel', function (e) {
  e.preventDefault();
  /* o zoom ancora no ponto sob o cursor: o que estava debaixo do mouse
     continua debaixo do mouse */
  var sx = e.clientX * DPR, sy = e.clientY * DPR;
  soltaCamera();
  var antes = doMundo(sx, sy);
  cam.w *= Math.exp(e.deltaY * 0.0012);
  cam.w = Math.max(30, Math.min(cam.w, 200000));
  var depois = doMundo(sx, sy);
  cam.x += antes[0] - depois[0]; cam.y += antes[1] - depois[1];
  desenha();
}, { passive: false });

TELA.addEventListener('click', function (e) {
  var sx = e.clientX * DPR, sy = e.clientY * DPR;
  if (modoRota && selecionada) { cliqueDeRota(sx, sy); return; }
  if (moveu) return;
  var achou = null, melhor = 1e9;
  for (var i = 0; i < UNIDADES.length; i++) {
    var u = UNIDADES[i], s = paraTela(u._l, u._t);
    var d = Math.hypot(s[0] - sx, s[1] - sy);
    var raio = Math.max(14 * DPR, chao(u.sizeM * ESCALA, u._t) * k() * 0.6);
    if (d < raio && d < melhor) { melhor = d; achou = u.id; }
  }
  selecionada = achou; sincronizaFicha(); desenha();
});

/* no modo rota: clicar longe põe um waypoint, clicar EM CIMA de um
   waypoint marca um tiro ali — o mesmo gesto do Globe Studio */
function cliqueDeRota(sx, sy) {
  var u = unidadePorId(selecionada);
  if (!u) return;
  if (!u.route || !u.route.length)
    u.route = [clonaPasso({ points: [[u.lon, u.lat]], speedKmh: 4 })];
  /* desenhar à mão mexe sempre no último passo ANDANTE: um passo de
     espera não tem onde pôr ponto. Quem quer um passo novo acrescenta no
     JSON, que é onde a edição mora de verdade */
  var iUlt = -1;
  for (var z = 0; z < u.route.length; z++) if (andante(u.route[z]) || u.route[z].points.length) iUlt = z;
  if (iUlt < 0) { u.route.push(clonaPasso({ points: [[u._l, u._t]], speedKmh: 4 })); iUlt = u.route.length - 1; }
  var r = u.route[iUlt], visto = 0, k2;
  for (k2 = 0; k2 < iUlt; k2++) visto += u.route[k2].points.length;
  for (var w = 0; w < r.points.length; w++) {
    var q = paraTela(r.points[w][0], r.points[w][1]);
    if (Math.hypot(q[0] - sx, q[1] - sy) < 11 * DPR) {
      u.shots = u.shots || [];
      u.shots.push({ at: visto + w, burst: 0.6 });
      seek(T); desenha(); return;
    }
  }
  var m = doMundo(sx, sy);
  r.points.push([+lonDe(m[0]).toFixed(6), +latDe(m[1]).toFixed(6)]);
  r._cache = null;
  seek(T); desenha();
}

/* =====================================================================
   OS BOTÕES
   ===================================================================== */
var btTocar = document.getElementById('btTocar'), linha = document.getElementById('linha'),
    cursor = document.getElementById('cursor'), relogio = document.getElementById('relogio');
var rafId = null, ultimo = 0;
function toca() {
  if (TOCANDO) return;
  TOCANDO = true; btTocar.textContent = '❚❚'; ultimo = performance.now();
  rafId = requestAnimationFrame(passo);
}
function pausa() { TOCANDO = false; btTocar.textContent = '▶'; if (rafId) cancelAnimationFrame(rafId); rafId = null; }
function passo(agora) {
  if (!TOCANDO) return;
  var dt = Math.min(0.1, (agora - ultimo) / 1000); ultimo = agora;
  var fim = fimDaCena();
  seek(T + dt);
  if (T >= fim) { seek(fim); pausa(); }
  desenha();
  if (TOCANDO) rafId = requestAnimationFrame(passo);
}
function sincronizaBarra() {
  var fim = fimDaCena();
  cursor.style.left = (Math.min(1, T / fim) * 100) + '%';
  relogio.textContent = T.toFixed(2) + ' / ' + fim.toFixed(2) + ' s';
}
btTocar.onclick = function () { TOCANDO ? pausa() : toca(); };
document.getElementById('btInicio').onclick = function () { pausa(); seek(0); desenha(); };
linha.onclick = function (e) {
  var r = linha.getBoundingClientRect();
  pausa(); seek((e.clientX - r.left) / r.width * fimDaCena()); desenha();
};

var painelTropas = document.getElementById('tropas');
document.getElementById('btTropas').onclick = function () {
  painelTropas.classList.toggle('aberto');
  this.classList.toggle('on', painelTropas.classList.contains('aberto'));
};
var btRota = document.getElementById('btRota');
btRota.onclick = function () {
  modoRota = !modoRota; this.classList.toggle('on', modoRota);
  TELA.classList.toggle('rota', modoRota);
};
var btTrajetos = document.getElementById('btTrajetos');
btTrajetos.onclick = function () { AJUDAS = !AJUDAS; this.classList.toggle('on', AJUDAS); desenha(); };
document.getElementById('btLimpar').onclick = function () { cena('limpar'); };

/* Quem manda na câmera: o relógio ou a mão.
   Com chaves na cena, os dois querem a mesma variável, e sem um dono
   explícito arrastar o mapa durante a reprodução vira uma briga em que a
   mão perde a cada quadro. Então: presa = o relógio manda; solta = a mão
   manda e as chaves ficam guardadas, intactas, esperando. Arrastar ou dar
   zoom solta sozinho, que é o que a mão quis dizer. */
var btLeg = document.getElementById('btLeg');
btLeg.onclick = function () { LEGENDAS = !LEGENDAS; this.classList.toggle('on', LEGENDAS); desenha(); };

var btCam = document.getElementById('btCam');
function sincronizaCamBotao() {
  btCam.classList.toggle('on', CAM_PRESA && CAM_CHAVES.length > 0);
  btCam.disabled = !CAM_CHAVES.length;
  btCam.title = !CAM_CHAVES.length ? 'esta cena não tem chaves de câmera'
              : (CAM_PRESA ? 'a câmera segue a cena (c para soltar)' : 'câmera livre (c para prender de volta)');
}
function soltaCamera() {
  if (!CAM_CHAVES.length || !CAM_PRESA) return;
  CAM_PRESA = false; sincronizaCamBotao();
}
btCam.onclick = function () {
  if (!CAM_CHAVES.length) return;
  CAM_PRESA = !CAM_PRESA; sincronizaCamBotao();
  if (CAM_PRESA) { aplicaCamera(T); desenha(); }
};

/* o painel de tropas: uma linha por TIPO. Clicar põe a unidade no centro
   da tela, que é onde se está olhando. */
var lista = document.getElementById('listaTropas');
function montaTropas() {
  lista.innerHTML = '';
  for (var i = 0; i < CATALOGO.length; i++) {
    (function (tipo) {
      var div = document.createElement('div'); div.className = 'tropa';
      var c = document.createElement('canvas'); c.width = c.height = 60;
      var g = c.getContext('2d');
      var im = IMAGENS[tipo.img] || fichaDeReserva(tipo, 60);
      var prop = im.height / im.width;
      g.drawImage(im, 0, 30 - 30 * prop, 60, 60 * prop);
      div.appendChild(c);
      var txt = document.createElement('div');
      txt.innerHTML = '<b>' + tipo.nome + '</b><br><span>' + tipo.sizeM + ' m' +
                      (tipo.arma ? ' · ' + tipo.arma.alcanceM + ' m de alcance' : '') + '</span>';
      div.appendChild(txt);
      div.onclick = function () { poe(tipo.id); };
      lista.appendChild(div);
    })(CATALOGO[i]);
  }
}
var contador = 0;
function poe(tipoId, lon, lat) {
  var tipo = tipoPorId(tipoId); if (!tipo) return null;
  if (lon === undefined) { lon = lonDe(cam.x); lat = latDe(cam.y); }
  var id = tipoId + '-' + (++contador);
  while (unidadePorId(id)) id = tipoId + '-' + (++contador);
  var u = fazUnidade({ id: id, type: tipoId, img: tipo.img, lon: lon, lat: lat, sizeM: tipo.sizeM });
  UNIDADES.push(u); selecionada = id; seek(T); sincronizaFicha(); desenha();
  return u;
}

/* a ficha da unidade selecionada */
var ficha = document.getElementById('ficha'), fNome = document.getElementById('fichaNome');
var fTam = document.getElementById('fTam'), fTamV = document.getElementById('fTamV');
var fGiro = document.getElementById('fGiro'), fGiroV = document.getElementById('fGiroV');
var fEsc = document.getElementById('fEsc'), fEscV = document.getElementById('fEscV');
function sincronizaFicha() {
  var u = unidadePorId(selecionada);
  ficha.classList.toggle('aberto', !!u);
  fEsc.value = ESCALA; fEscV.textContent = (+ESCALA).toFixed(2) + '×';
  if (!u) return;
  fNome.textContent = u.id;
  fTam.value = u.sizeM; fTamV.textContent = u.sizeM + ' m';
  fGiro.value = u.spin; fGiroV.textContent = u.spin + '°';
}
fTam.oninput = function () { var u = unidadePorId(selecionada); if (u) { u.sizeM = +this.value; sincronizaFicha(); desenha(); } };
fGiro.oninput = function () { var u = unidadePorId(selecionada); if (u) { u.spin = +this.value; seek(T); sincronizaFicha(); desenha(); } };
fEsc.oninput = function () { ESCALA = +this.value; sincronizaFicha(); desenha(); };
document.getElementById('fApaga').onclick = function () {
  var i = UNIDADES.findIndex(function (u) { return u.id === selecionada; });
  if (i >= 0) UNIDADES.splice(i, 1);
  selecionada = null; sincronizaFicha(); desenha();
};

document.addEventListener('keydown', function (e) {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  var u = unidadePorId(selecionada);
  if (e.code === 'Space') { e.preventDefault(); TOCANDO ? pausa() : toca(); }
  else if (e.key === '0') { pausa(); seek(0); desenha(); }
  else if (e.key === 'u') document.getElementById('btTropas').onclick.call(document.getElementById('btTropas'));
  else if (e.key === 't') btRota.onclick.call(btRota);
  else if (e.key === 'h') btTrajetos.onclick.call(btTrajetos);
  else if (e.key === 'c') btCam.onclick.call(btCam);
  else if (e.key === 'l') btLeg.onclick.call(btLeg);
  else if (e.key === 'v') { document.querySelectorAll('.painel').forEach(function (p) { p.classList.toggle('oculto'); }); }
  else if (e.key === '[' && u) { u.sizeM = Math.max(2, u.sizeM * 0.85); sincronizaFicha(); desenha(); }
  else if (e.key === ']' && u) { u.sizeM = u.sizeM * 1.18; sincronizaFicha(); desenha(); }
  else if ((e.key === 'ArrowLeft' || e.key === 'ArrowRight') && u) {
    u.spin += (e.key === 'ArrowLeft' ? -5 : 5); seek(T); sincronizaFicha(); desenha();
  }
});

var selCena = document.getElementById('selCena');
selCena.onchange = function () { if (this.value) cena(this.value); this.value = ''; };

/* =====================================================================
   A PORTA DE FORA
   O render.mjs fala com a página só por aqui: seek(t), render() e mais
   nada. Nenhum estado entre um quadro e o outro.
   ===================================================================== */
window.__mapa = {
  seek: function (t) { seek(t); }, render: function () { desenha(); },
  play: toca, pause: pausa,
  loadScene: loadCena, loadCena: loadCena,
  scene: objetoDaCena, cena: objetoDaCena,
  exportScene: function () { return JSON.stringify(objetoDaCena(), null, 2); },
  exportCena: function () { return JSON.stringify(objetoDaCena(), null, 2); },
  validateScene: validaCena, validaCena: validaCena,
  demo: cena, demos: function () { return Object.keys(CENAS); },
  placas: function () { return PLACAS; },
  /* para conferir uma rota no console antes de escrevê-la na cena */
  rua: function (deLon, deLat, paraLon, paraLat) {
    return caminhoDeRua(deLon, deLat, paraLon, paraLat);
  },
  bloqueado: bloqueado,
  malha: function () {
    var g = malhaPronta();
    return g ? { nos: g.n, arestas: MALHA.arestas.length / 3,
                 bloqueio: MALHA.bloqueio.largura + 'x' + MALHA.bloqueio.altura +
                           ' a ' + MALHA.bloqueio.metrosPorCelula + ' m' } : null;
  },
  catalogo: function () { return CATALOGO; },
  sprites: UNIDADES,
  spawn: poe,
  addSprite: function (d) { var u = fazUnidade(d); UNIDADES.push(u); seek(T); desenha(); return u; },
  setSprite: function (id, campos) {
    var u = unidadePorId(id); if (!u) return null;
    for (var ch in campos) if (campos.hasOwnProperty(ch)) u[ch] = campos[ch];
    if (campos.route) u.route = clonaRota(campos.route);
    seek(T); desenha(); return u;
  },
  removeSprite: function (id) {
    var i = UNIDADES.findIndex(function (u) { return u.id === id; });
    if (i >= 0) UNIDADES.splice(i, 1);
    desenha(); return i >= 0;
  },
  setRoute: function (id, r) {
    var u = unidadePorId(id); if (!u) return null;
    u.route = r ? clonaRota(r) : null; seek(T); desenha(); return u;
  },
  camera: function (lon, lat, larguraM) { soltaCamera(); poeCamera(lon, lat, larguraM); desenha(); return cameraAtual(); },
  chaves: function (K) {
    if (K === undefined) return CAM_CHAVES.slice();
    CAM_CHAVES = (K || []).map(function (c) {
      return { t: +c.t || 0, lon: +c.lon, lat: +c.lat, larguraM: +c.larguraM,
               corte: !!c.corte, suave: c.suave, placa: c.placa || null };
    }).sort(function (a, b) { return a.t - b.t; });
    CAM_PRESA = true; sincronizaCamBotao(); seek(T); desenha();
    return CAM_CHAVES.slice();
  },
  set: function (o) {
    if (o.helpers !== undefined) { AJUDAS = !!o.helpers; btTrajetos.classList.toggle('on', AJUDAS); }
    if (o.legendas !== undefined) { LEGENDAS = !!o.legendas; btLeg.classList.toggle('on', LEGENDAS); }
    if (o.placa !== undefined) CENA_PLACA = o.placa;
    if (o.cameraPresa !== undefined) { CAM_PRESA = !!o.cameraPresa; sincronizaCamBotao(); if (CAM_PRESA) aplicaCamera(T); }
    desenha();
  },
  info: function () {
    var tiros = todosOsTiros(), mortes = 0, homens = 0;
    for (var i = 0; i < tiros.length; i++) if (tiros[i].sh.kill) mortes++;
    for (var j = 0; j < UNIDADES.length; j++) homens += UNIDADES[j].grupo ? UNIDADES[j].grupo.n : 1;
    return { images: Object.keys(IMAGENS), sprites: UNIDADES.length, homens: homens, end: fimDaCena(),
             shots: tiros.length, kills: mortes, placas: PLACAS.map(function (p) { return p.nome; }),
             chavesDeCamera: CAM_CHAVES.length, cameraPresa: CAM_PRESA,
             escalaDoTempo: ESCALA_TEMPO, marcos: MARCOS.length,
             relogio: RELOGIO_INICIO === null ? null : hhmm(RELOGIO_INICIO),
             camera: cameraAtual() };
  }
};

/* =====================================================================
   ABRIR
   ===================================================================== */
var aviso = document.getElementById('aviso');
function erro(txt) { aviso.textContent = txt; aviso.style.display = 'flex'; }

(function abre() {
  if (!PLACAS.length) { erro('Nenhuma placa embutida. Rode: node tools/pack.mjs'); return; }
  for (var n in CENAS) if (CENAS.hasOwnProperty(n)) {
    var o = document.createElement('option'); o.value = n; o.textContent = n; selCena.appendChild(o);
  }
  var o2 = document.createElement('option'); o2.value = 'limpar'; o2.textContent = 'limpar o mapa'; selCena.appendChild(o2);

  var faltam = PLACAS.length + Object.keys(IMG_B64).length;
  function pronto() {
    if (prontas < faltam) return;
    var p = PLACAS[0];
    /* abre na placa mais larga, inteira na tela */
    var lon = (p.limites.oeste + p.limites.leste) / 2, lat = (p.limites.sul + p.limites.norte) / 2;
    poeCamera(lon, lat, p.larguraKm * 1000);
    montaTropas();
    redimensiona();
    seek(0);
    desenha();
  }
  for (var i = 0; i < PLACAS.length; i++)
    carregaImagem('placa:' + PLACAS[i].nome, PLACAS[i].b64, PLACAS[i].mime, pronto);
  for (var nome in IMG_B64) if (IMG_B64.hasOwnProperty(nome)) carregaImagem(nome, IMG_B64[nome], 'image/png', pronto);
  if (!faltam) pronto();
})();
</script>
