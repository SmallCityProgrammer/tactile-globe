function hud() {

  document.getElementById('bar').style.width = (km / mpp) + 'px';
  document.getElementById('barTxt').textContent = km >= 1000 ? (km / 1000) + ' km' : km + ' m';
  const [lat, lon] = toLL(cam.x, cam.y);
  document.getElementById('pos').textContent = `${lat.toFixed(3)}°N ${lon.toFixed(3)}°E · ${mpp >= 1 ? mpp.toFixed(0) + ' m' : (mpp * 100).toFixed(0) + ' cm'}/px · ${lastFrameMs.toFixed(0)} ms`;
}
function zoomAt(px, py, k) {

  const s2 = clamp(cam.s * k, S_MIN, S_MAX); if (s2 === cam.s) return;
  const wx = cam.x + (px - W / 2) / cam.s, wy = cam.y + (py - H / 2) / cam.s;
  cam.s = s2; cam.x = wx - (px - W / 2) / s2; cam.y = wy - (py - H / 2) / s2; dirty = true;
}

canvas.addEventListener('pointerdown', e => { if (catalog) return; fly = null; canvas.setPointerCapture(e.pointerId); pointers.set(e.pointerId, [e.clientX, e.clientY]); dragging = true; canvas.classList.add('drag'); if (pointers.size === 2) { const [a, b] = [...pointers.values()]; pinch = { d: Math.max(8, Math.hypot(a[0] - b[0], a[1] - b[1])), s: cam.s }; } });
canvas.addEventListener('pointermove', e => {

  else if (pointers.size === 2 && pinch) { const [a, b] = [...pointers.values()]; const d = Math.hypot(a[0] - b[0], a[1] - b[1]); const r = canvas.getBoundingClientRect(); zoomAt((a[0] + b[0]) / 2 - r.left, (a[1] + b[1]) / 2 - r.top, (pinch.s * d / pinch.d) / cam.s); }
});
const up = e => { pointers.delete(e.pointerId); if (!pointers.size) { dragging = false; pinch = null; canvas.classList.remove('drag'); } };
canvas.addEventListener('pointerup', up); canvas.addEventListener('pointercancel', up);
canvas.addEventListener('dblclick', e => { if (catalog) return; const r = canvas.getBoundingClientRect(); flyTo(cam.x + (e.clientX - r.left - W / 2) / cam.s, cam.y + (e.clientY - r.top - H / 2) / cam.s, cam.s * 4); });
let fly = null;
function flyTo(x, y, s) { fly = { x0: cam.x, y0: cam.y, s0: cam.s, x1: x, y1: y, s1: clamp(s, S_MIN, S_MAX), t0: performance.now(), dur: 1400 }; }
function homeView() { flyTo(45000, -250000, Math.min(W / 1.62e6, H / 1.72e6)); }
window.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  if (e.key === 'Escape' && catalog) { exitCatalog(); return; }
  if (e.key === 'c' || e.key === 'C') toggle('bClans', showClans = !showClans);
  else if (e.key === 'l' || e.key === 'L') toggle('bLabels', showLabels = !showLabels);
  else if (e.key === 'g' || e.key === 'G') toggle('bGrid', showGrid = !showGrid);
