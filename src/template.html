<title>Tactile Globe</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#e3e6e9}
  #gl{display:block;width:100vw;height:100vh;touch-action:none;cursor:grab}
  #gl.drag{cursor:grabbing}
  #msg{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
       font:14px system-ui,sans-serif;color:#666}
  #ui{position:fixed;right:20px;bottom:20px;display:flex;gap:8px}
  #ui button{-webkit-appearance:none;appearance:none;
       font:500 12px/1 system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:.02em;
       padding:10px 15px;border-radius:999px;cursor:pointer;user-select:none;
       color:#5c636a;background:rgba(255,255,255,.70);border:1px solid rgba(92,99,106,.26);
       -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
       transition:background .14s,color .14s,border-color .14s}
  #ui button:hover{background:rgba(255,255,255,.96);border-color:rgba(92,99,106,.42)}
  #ui button[aria-pressed="true"]{background:#5c636a;color:#eef1f2;border-color:#5c636a}
  #ui button:focus-visible{outline:2px solid #5c636a;outline-offset:2px}
</style>
<canvas id="gl"></canvas>
<div id="msg"></div>
<div id="ui">
  <button id="relief" type="button" aria-pressed="false">relief</button>
  <button id="borders" type="button" aria-pressed="true">land borders</button>
  <button id="detail" type="button" aria-pressed="false">states &amp; provinces</button>
</div>
<script id="geo" type="application/octet-stream">__DATA_B64__</script>
<script id="geo2" type="application/octet-stream">__DATA2_B64__</script>
<script id="geo5" type="application/octet-stream">__DATA5_B64__</script>
<script id="reliefpng" type="application/octet-stream">__RELIEF_B64__</script>
<script>
(function(){
'use strict';

var canvas = document.getElementById('gl');
var msg = document.getElementById('msg');
function fail(t){ msg.textContent = t; msg.style.display = 'flex'; }

/* No multisampling: it would antialias the sphere's edge, but at the cost
   of running the whole frame at 4 samples. Measured A/B, that is free where
   little of the screen is covered and up to ~1 ms where it is — 1.5 ms to
   3.1 ms on the heaviest frame. The region's outline is drawn as a line
   instead, in its own colour, and covers the hard edge for almost nothing. */
var gl = canvas.getContext('webgl2', {
  alpha:false, antialias:false, depth:false, stencil:false,
  premultipliedAlpha:false, preserveDrawingBuffer:false,
  powerPreference:'high-performance'
});
if(!gl){ fail('WebGL2 is not available in this browser.'); return; }

/* ============================================================
   1. DATA - zigzag varints -> chains of lon/lat at 1e-6 degree
   ============================================================ */
var QS = 1e-6;
var DEG = Math.PI/180;
function decode(id){
  var bin = atob(document.getElementById(id).textContent);
  var n = bin.length, buf = new Uint8Array(n), i;
  for(i=0;i<n;i++) buf[i] = bin.charCodeAt(i);
  bin = null;
  var p = 0;
  function rv(){
    var x = 0, sh = 1, b;
    do { b = buf[p++]; x += (b & 127) * sh; sh *= 128; } while (b & 128);
    return (x % 2) ? -(x + 1) / 2 : x / 2;
  }
  var nc = rv(), out = new Array(nc), lx = 0, ly = 0;
  for(var c=0;c<nc;c++){
    var np = rv(), a = new Int32Array(2*np);
    for(var j=0;j<np;j++){ lx += rv(); ly += rv(); a[2*j] = lx; a[2*j+1] = ly; }
    out[c] = a;
  }
  return out;
}

/* ============================================================
   2. LEVELS OF DETAIL
      tol  = Douglas-Peucker tolerance (degrees)
      step = maximum densification step (degrees)
   ============================================================ */
var LODS = [
  { tol: 0,     step: 0.02 },
  { tol: 0.008, step: 0.06 },
  { tol: 0.04,  step: 0.25 },
  { tol: 0.15,  step: 0.90 },
  { tol: 0.45,  step: 2.50 }
];

/* layer 0 = countries (coastline + national borders)
   layer 1 = internal state/province borders only
   Drawn in reverse order — subdivisions first, countries on top — so the
   heavier line wins wherever the two nearly touch. */
/* layer 0 = coastlines, layer 3 = country-to-country land borders. They are
   split so the internal lines can be switched off and leave the continents'
   outline standing. The split is exact and came free out of the deduplication:
   a segment carried by two country polygons is a land border, one carried by
   a single polygon is coast. */
var LAYERS = [
  { chains: decode('geo'),  cache: new Array(LODS.length),
    color: new Float32Array([0.376, 0.404, 0.427]), width: 1.15, on: true },
  { chains: decode('geo2'), cache: new Array(LODS.length),
    color: new Float32Array([0.612, 0.643, 0.667]), width: 0.90, on: false }
];

/* No filled region ships in this build. The machinery below is generic —
   it takes any bag of closed rings and fills them by even-odd parity — but
   nothing is handed to it here, so the pass never runs. */
/* layer 2 = the land borders split off from the coastlines */
LAYERS.push({
  chains: decode('geo5'), cache: new Array(LODS.length),
  color: LAYERS[0].color, width: LAYERS[0].width, on: true
});

/* ---------- spatial grid, for view culling ----------
   Segments are bucketed by the cell of their start point and the instance
   buffer is laid out in cell order, so any set of visible cells collapses
   into a handful of contiguous draw ranges. Cells are ordered band-major,
   which keeps a horizontal sweep contiguous. */
var CELL = 4;                               // degrees
var NLON = Math.round(360/CELL), NLAT = Math.round(180/CELL);
var NCELL = NLON*NLAT;

function cellOf(lon, lat){
  var x = (lon + 180) % 360; if (x < 0) x += 360;
  x = (x/CELL)|0; if (x >= NLON) x = NLON - 1;
  var y = ((lat + 90)/CELL)|0;
  if (y < 0) y = 0; else if (y >= NLAT) y = NLAT - 1;
  return y*NLON + x;
}

/* bounding cap per cell: centre direction + angular radius, derived from the
   cell's lon/lat rectangle sampled along its boundary */
var cellDir = new Float32Array(NCELL*3);
var cellCos = new Float32Array(NCELL);
var cellSin = new Float32Array(NCELL);
(function(){
  var c = [0,0,0], p = [0,0,0];
  for (var y = 0; y < NLAT; y++){
    var la0 = y*CELL - 90, la1 = la0 + CELL;
    for (var x = 0; x < NLON; x++){
      var lo0 = x*CELL - 180, lo1 = lo0 + CELL, i = y*NLON + x;
      sph((lo0+lo1)/2, (la0+la1)/2, c);
      var worst = 1;
      for (var u = 0; u <= 8; u++){
        for (var v = 0; v <= 8; v++){
          if (u > 0 && u < 8 && v > 0 && v < 8) continue;   // boundary only
          sph(lo0 + (lo1-lo0)*u/8, la0 + (la1-la0)*v/8, p);
          var d = c[0]*p[0] + c[1]*p[1] + c[2]*p[2];
          if (d < worst) worst = d;
        }
      }
      var r = Math.acos(Math.max(-1, Math.min(1, worst))) + 0.004;   // safety slack
      cellDir[3*i] = c[0]; cellDir[3*i+1] = c[1]; cellDir[3*i+2] = c[2];
      cellCos[i] = Math.cos(r); cellSin[i] = Math.sin(r);
    }
  }
})();

function simplify(ch, tolQ){
  var n = ch.length/2;
  if (tolQ <= 0 || n < 3) return ch;
  var keep = new Uint8Array(n); keep[0] = 1; keep[n-1] = 1;
  var st = [0, n-1], t2 = tolQ*tolQ;
  while (st.length){
    var j = st.pop(), i = st.pop();
    if (j - i < 2) continue;
    var ax = ch[2*i], ay = ch[2*i+1], dx = ch[2*j]-ax, dy = ch[2*j+1]-ay;
    var dd = dx*dx + dy*dy, best = -1, bi = -1;
    for (var k = i+1; k < j; k++){
      var px = ch[2*k]-ax, py = ch[2*k+1]-ay, d2;
      if (dd === 0){ d2 = px*px + py*py; }
      else {
        var t = (px*dx + py*dy)/dd; t = t < 0 ? 0 : t > 1 ? 1 : t;
        var ex = px - t*dx, ey = py - t*dy; d2 = ex*ex + ey*ey;
      }
      if (d2 > best){ best = d2; bi = k; }
    }
    if (best > t2){ keep[bi] = 1; st.push(i, bi, bi, j); }
  }
  var m = 0, q;
  for (q = 0; q < n; q++) if (keep[q]) m++;
  var out = new Int32Array(2*m), w = 0;
  for (q = 0; q < n; q++) if (keep[q]){ out[2*w] = ch[2*q]; out[2*w+1] = ch[2*q+1]; w++; }
  return out;
}

function subCount(ax, ay, bx, by, step){
  var dx = (bx-ax)*QS, dy = (by-ay)*QS;
  if (dx > 180) dx -= 360; else if (dx < -180) dx += 360;
  if (dx < 0) dx = -dx;
  if (dy < 0) dy = -dy;
  var k = Math.ceil((dx > dy ? dx : dy)/step);
  return k < 1 ? 1 : k;
}

/* lon/lat in degrees -> point on the unit sphere (east = right, north = up) */
function sph(lon, lat, o){
  var la = lat*DEG, lo = lon*DEG, cl = Math.cos(la);
  o[0] = cl*Math.cos(lo); o[1] = Math.sin(la); o[2] = -cl*Math.sin(lo);
}

function buildLOD(chains, idx){
  var tolQ = LODS[idx].tol/QS, step = LODS[idx].step;
  var simp = new Array(chains.length), c, i, n, s;

  for (c = 0; c < chains.length; c++) simp[c] = simplify(chains[c], tolQ);

  /* pass 1 - count sub-segments per cell (no trig needed) */
  var segs = 0, counts = new Int32Array(NCELL), q, t, k, lonA, latA, dlon, dlat, ch;
  for (c = 0; c < simp.length; c++){
    ch = simp[c]; n = ch.length/2;
    if (n < 2) continue;
    for (i = 0; i+1 < n; i++){
      lonA = ch[2*i]*QS; latA = ch[2*i+1]*QS;
      dlon = ch[2*i+2]*QS - lonA;
      if (dlon > 180) dlon -= 360; else if (dlon < -180) dlon += 360;
      dlat = ch[2*i+3]*QS - latA;
      k = subCount(ch[2*i], ch[2*i+1], ch[2*i+2], ch[2*i+3], step);
      for (q = 0; q < k; q++){
        t = q/k;
        counts[cellOf(lonA + dlon*t, latA + dlat*t)]++;
        segs++;
      }
    }
  }

  /* prefix sums -> where each cell's block starts */
  var start = new Int32Array(NCELL + 1), cursor = new Int32Array(NCELL), acc = 0;
  for (i = 0; i < NCELL; i++){ start[i] = acc; cursor[i] = acc; acc += counts[i]; }
  start[NCELL] = acc;

  /* pass 2 - emit each sub-segment into its cell's block */
  var data = new Float32Array(9*segs), w, d, v, hi;
  var A = [0,0,0], B = [0,0,0];
  for (c = 0; c < simp.length; c++){
    ch = simp[c]; n = ch.length/2;
    if (n < 2) continue;
    sph(ch[0]*QS, ch[1]*QS, A);
    for (i = 0; i+1 < n; i++){
      lonA = ch[2*i]*QS; latA = ch[2*i+1]*QS;
      dlon = ch[2*i+2]*QS - lonA;
      if (dlon > 180) dlon -= 360; else if (dlon < -180) dlon += 360;
      dlat = ch[2*i+3]*QS - latA;
      k = subCount(ch[2*i], ch[2*i+1], ch[2*i+2], ch[2*i+3], step);
      for (q = 1; q <= k; q++){
        t = q/k;
        sph(lonA + dlon*t, latA + dlat*t, B);
        w = 9*cursor[cellOf(lonA + dlon*(q-1)/k, latA + dlat*(q-1)/k)]++;
        for (d = 0; d < 3; d++){
          v = A[d]; hi = Math.fround(v);
          data[w+d]   = hi;
          data[w+3+d] = Math.fround(v - hi);
          data[w+6+d] = Math.fround(B[d] - v);
        }
        A[0] = B[0]; A[1] = B[1]; A[2] = B[2];
      }
    }
  }
  return { count: segs, data: data, start: start };
}

function sh(type, src){
  var o = gl.createShader(type);
  gl.shaderSource(o, src); gl.compileShader(o);
  if(!gl.getShaderParameter(o, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(o));
  return o;
}
function prog(vs, fs){
  var p = gl.createProgram();
  gl.attachShader(p, sh(gl.VERTEX_SHADER, vs));
  gl.attachShader(p, sh(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  if(!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  return p;
}
function U(p){
  var m = {}, n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (var i = 0; i < n; i++){
    var nm = gl.getActiveUniform(p, i).name;
    m[nm] = gl.getUniformLocation(p, nm);
  }
  return m;
}

/* pass 1: analytic sphere - exact intersection, no faceting at any zoom */
var SPH_VS = '#version 300 es\n' + [
'out vec2 vNdc;',
'void main(){',
'  float x = float((gl_VertexID & 1) << 2) - 1.0;',
'  float y = float((gl_VertexID & 2) << 1) - 1.0;',
'  vNdc = vec2(x, y);',
'  gl_Position = vec4(x, y, 0.0, 1.0);',
'}'].join('\n');

var SPH_FS = '#version 300 es\n' + [
'precision highp float;',
'in vec2 vNdc;',
'uniform vec3 uRight, uUp, uFwd, uCamDir, uLight, uBgTop, uBgBot;',
'uniform float uTanHF, uAspect, uC2, uR, uInvR, uHOverR;',
'uniform sampler2D uRelief;',
'uniform vec2 uTexel, uTexSize;',
'uniform float uReliefAmt, uSlope;',
'out vec4 frag;',
'void main(){',
'  vec3 d = normalize(uRight*(vNdc.x*uTanHF*uAspect) + uUp*(vNdc.y*uTanHF) + uFwd);',
'  float ct = -dot(d, uCamDir);',
'  float s2 = max(0.0, 1.0 - ct*ct);',
'  float disc = ct*ct - uC2*s2;',
'  vec3 bg = mix(uBgBot, uBgTop, vNdc.y*0.5 + 0.5);',
'  float gr = length(vec2(dFdx(disc), dFdy(disc)));',
'  float cov = clamp(disc/max(gr, 1e-30) + 0.5, 0.0, 1.0);',
'  if (ct <= 0.0 || cov <= 0.0){ frag = vec4(bg, 1.0); return; }',
'  float sq = sqrt(max(disc, 0.0));',
'  float t  = uC2 / max(ct*uR + sq, 1e-20);',
'  vec3 p = t*d;',
'  vec3 n = normalize(p + uR*uCamDir);',
'  float diff = pow(clamp(dot(n, uLight)*0.5 + 0.5, 0.0, 1.0), 1.20);',
'  float w    = clamp((dot(n, uCamDir) - uInvR)/uHOverR, 0.0, 1.0);',
'  float limb = mix(0.885, 1.0, pow(w, 0.42));',
'  float shade = mix(0.795, 1.0, diff) * limb;',
/* Relief. The elevation raster is equirectangular, so the surface normal
   gives the lookup directly. The sampling offset follows the on-screen
   texel footprint, and the matching mip level is fetched explicitly:
   letting the hardware pick it would collapse two neighbouring taps onto
   the same texel when minified, and the relief would vanish exactly when
   the whole globe is in view. */
'  if (uReliefAmt > 0.0){',
'    float la = asin(clamp(n.y, -1.0, 1.0));',
'    float lo = atan(-n.z, n.x);',
'    vec2 uv = vec2(lo*0.1591549431 + 0.5, 0.5 - la*0.3183098862);',
'    vec2 ddx = dFdx(uv), ddy = dFdy(uv);',
'    ddx.x -= floor(ddx.x + 0.5);',           // the seam at the antimeridian
'    ddy.x -= floor(ddy.x + 0.5);',
'    float rho = max(length(ddx*uTexSize), length(ddy*uTexSize));',
'    float lod = clamp(log2(max(rho, 1.0)), 0.0, 7.0);',
'    vec2 st = exp2(lod)*uTexel;',
'    float ex = textureLod(uRelief, uv + vec2(st.x, 0.0), lod).r',
'             - textureLod(uRelief, uv - vec2(st.x, 0.0), lod).r;',
'    float ey = textureLod(uRelief, uv + vec2(0.0, st.y), lod).r',
'             - textureLod(uRelief, uv - vec2(0.0, st.y), lod).r;',
'    float cl = max(cos(la), 0.03);',
'    vec3 nl = normalize(vec3(-ex*uSlope/cl, ey*uSlope, 1.0));',
'    float hs = dot(nl, vec3(-0.5, 0.5, 0.7071068));',   // light from the north-west
'    shade *= clamp(1.0 + uReliefAmt*(hs - 0.7071068), 0.35, 1.6);',
'  }',
'  frag = vec4(mix(bg, vec3(shade), cov), 1.0);',
'}'].join('\n');

/* pass 2: instanced lines, constant width in pixels, positions in emulated
   double precision (hi/lo split, subtracted relative to the eye) */
var LIN_VS = '#version 300 es\n' + [
'precision highp float;',
'layout(location=0) in vec3 aHi;',
'layout(location=1) in vec3 aLo;',
'layout(location=2) in vec3 aDelta;',
'uniform vec3 uCamHi, uCamLo;',
'uniform mat3 uView;',
'uniform vec2 uVp;',
'uniform float uTanHF, uAspect, uNear, uPad, uHorizK;',
'uniform vec3 uCamDir;',
'out vec3 vRel;',
'out vec2 vSeg;',
'flat out float vLen;',
'vec2 toPx(vec3 v){',
'  vec2 ndc = vec2(v.x/(-v.z)/(uTanHF*uAspect), v.y/(-v.z)/uTanHF);',
'  return (ndc*0.5 + 0.5)*uVp;',
'}',
'void main(){',
'  vec3 relA = (aHi - uCamHi) + (aLo - uCamLo);',
'  vec3 relB = relA + aDelta;',
'  if (dot(relA, uCamDir) + uHorizK < 0.0 && dot(relB, uCamDir) + uHorizK < 0.0){',
'    vRel = vec3(0.0); vSeg = vec2(0.0); vLen = 0.0;',
'    gl_Position = vec4(2.0, 2.0, 0.0, 1.0); return;',
'  }',
'  vec3 va = uView*relA, vb = uView*relB;',
'  if (va.z > -uNear && vb.z > -uNear){',
'    vRel = vec3(0.0); vSeg = vec2(0.0); vLen = 0.0;',
'    gl_Position = vec4(2.0, 2.0, 0.0, 1.0); return;',
'  }',
'  float ta = 0.0, tb = 1.0;',
'  float tc = (va.z + uNear)/(va.z - vb.z);',
'  if (va.z > -uNear) ta = tc; else if (vb.z > -uNear) tb = tc;',
'  vec3 ca = mix(va, vb, ta),     cb = mix(va, vb, tb);',
'  vec3 ra = mix(relA, relB, ta), rb = mix(relA, relB, tb);',
'  vec2 sa = toPx(ca), sb = toPx(cb);',
'  vec2 dv = sb - sa;',
'  float len = length(dv);',
'  vec2 dir = len > 1e-6 ? dv/len : vec2(1.0, 0.0);',
'  vec2 nr  = vec2(-dir.y, dir.x);',
'  float s = float(gl_VertexID & 1)*2.0 - 1.0;',
'  float e = float((gl_VertexID >> 1) & 1);',
'  vec2 pos = mix(sa, sb, e) + nr*(s*uPad) + dir*((e*2.0 - 1.0)*uPad);',
'  vSeg = vec2(e*len + (e*2.0 - 1.0)*uPad, s*uPad);',
'  vLen = len;',
'  vRel = mix(ra, rb, e);',
'  gl_Position = vec4((pos/uVp)*2.0 - 1.0, 0.0, 1.0);',
'}'].join('\n');

var LIN_FS = '#version 300 es\n' + [
'precision highp float;',
'in vec3 vRel;',
'in vec2 vSeg;',
'flat in float vLen;',
'uniform vec3 uCamDir, uLight, uLineColor;',
'uniform float uHorizK, uR, uHalfW;',
'out vec4 frag;',
'void main(){',
'  float ax = clamp(vSeg.x, 0.0, vLen);',
'  float dist = length(vec2(vSeg.x - ax, vSeg.y));',
'  float a = clamp(uHalfW - dist + 0.5, 0.0, 1.0);',
'  float g  = dot(vRel, uCamDir) + uHorizK;',
'  float gw = length(vec2(dFdx(g), dFdy(g)));',
'  a *= clamp(g/max(gw, 1e-30) + 0.5, 0.0, 1.0);',
'  if (a <= 0.0) discard;',
'  vec3 n = normalize(vRel + uR*uCamDir);',
'  float diff = clamp(dot(n, uLight)*0.5 + 0.5, 0.0, 1.0);',
'  frag = vec4(uLineColor * mix(0.86, 1.0, diff), a);',
'}'].join('\n');

var pSph, pLin, uSph, uLin;
try { pSph = prog(SPH_VS, SPH_FS); pLin = prog(LIN_VS, LIN_FS); }
catch(e){ fail('Erro de shader: ' + e.message); return; }
uSph = U(pSph); uLin = U(pLin);

/* elevation raster, decoded by the browser straight out of the embedded PNG */
var reliefTex = null;
var RELIEF_W = 0, RELIEF_H = 0;
(function(){
  var im = new Image();
  im.onload = function(){
    RELIEF_W = im.width; RELIEF_H = im.height;
    reliefTex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, reliefTex);
    gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.R8, gl.RED, gl.UNSIGNED_BYTE, im);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.generateMipmap(gl.TEXTURE_2D);
    gl.bindTexture(gl.TEXTURE_2D, null);
    requestRender();
  };
  im.src = 'data:image/png;base64,' + document.getElementById('reliefpng').textContent;
})();

var emptyVao = gl.createVertexArray();
function uploadLOD(L, idx){
  var b = buildLOD(L.chains, idx);
  var vao = gl.createVertexArray();
  gl.bindVertexArray(vao);
  var vbo = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
  gl.bufferData(gl.ARRAY_BUFFER, b.data, gl.STATIC_DRAW);
  for (var i = 0; i < 3; i++){
    gl.enableVertexAttribArray(i);
    gl.vertexAttribPointer(i, 3, gl.FLOAT, false, 36, i*12);
    gl.vertexAttribDivisor(i, 1);
  }
  gl.bindVertexArray(null);
  L.cache[idx] = { vao: vao, vbo: vbo, count: b.count, start: b.start,
                   margin: LODS[idx].step*1.5*DEG };
  return L.cache[idx];
}

/* B is the same buffer read one point further along — the two attributes
   alias the same bytes, which is what keeps the fan's shared edges exact */
/* ============================================================
   4. CAMERA - all state kept in double precision on the CPU
   ============================================================ */
var FOV = 45*DEG, TANHF = Math.tan(FOV/2);
var H_MIN = 2.0e-6, H_MAX = 24.0;
var lon = -50, lat = -12;
var logH = Math.log(2.1), logHTarget = logH, h = Math.exp(logH);

var camU = [0,0,0], camX = [0,0,0], camY = [0,0,0], camPos = [0,0,0];
var camHi = new Float32Array(3), camLo = new Float32Array(3);
var viewMat = new Float32Array(9);
var lightW = new Float32Array(3);
var R = 1, C2 = 0;

function norm(v){
  var l = Math.sqrt(v[0]*v[0] + v[1]*v[1] + v[2]*v[2]);
  v[0]/=l; v[1]/=l; v[2]/=l; return v;
}

function updateCam(){
  h = Math.exp(logH);
  R  = 1 + h;
  C2 = 2*h + h*h;
  sph(lon, lat, camU);
  camX[0] = camU[2]; camX[1] = 0; camX[2] = -camU[0];
  var lx = Math.sqrt(camX[0]*camX[0] + camX[2]*camX[2]);
  if (lx < 1e-12){ camX[0] = 1; camX[1] = 0; camX[2] = 0; }
  else { camX[0] /= lx; camX[2] /= lx; }
  camY[0] = camU[1]*camX[2] - camU[2]*camX[1];
  camY[1] = camU[2]*camX[0] - camU[0]*camX[2];
  camY[2] = camU[0]*camX[1] - camU[1]*camX[0];
  norm(camY);
  var i;
  for (i = 0; i < 3; i++){
    camPos[i] = R*camU[i];
    var hi = Math.fround(camPos[i]);
    camHi[i] = hi;
    camLo[i] = Math.fround(camPos[i] - hi);
  }
  viewMat[0]=camX[0]; viewMat[3]=camX[1]; viewMat[6]=camX[2];
  viewMat[1]=camY[0]; viewMat[4]=camY[1]; viewMat[7]=camY[2];
  viewMat[2]=camU[0]; viewMat[5]=camU[1]; viewMat[8]=camU[2];
  var LV = [-0.42, 0.52, 0.74];
  for (i = 0; i < 3; i++) lightW[i] = camX[i]*LV[0] + camY[i]*LV[1] + camU[i]*LV[2];
  var ll = Math.sqrt(lightW[0]*lightW[0] + lightW[1]*lightW[1] + lightW[2]*lightW[2]);
  lightW[0]/=ll; lightW[1]/=ll; lightW[2]/=ll;
}

var rayD = [0,0,0];
function rayFor(px, py){
  var cw = canvas.clientWidth, chh = canvas.clientHeight;
  var nx = (px/cw)*2 - 1, ny = 1 - (py/chh)*2;
  var a = nx*TANHF*(cw/chh), b = ny*TANHF;
  rayD[0] = camX[0]*a + camY[0]*b - camU[0];
  rayD[1] = camX[1]*a + camY[1]*b - camU[1];
  rayD[2] = camX[2]*a + camY[2]*b - camU[2];
  return norm(rayD);
}

/* sphere point under a pixel; outside the disc returns the nearest point
   0 = behind the camera, 1 = outside the disc, 2 = real hit */
function pick(px, py, out){
  var d = rayFor(px, py);
  var ct = -(d[0]*camU[0] + d[1]*camU[1] + d[2]*camU[2]);
  if (ct <= 0) return 0;
  var s2 = 1 - ct*ct; if (s2 < 0) s2 = 0;
  var disc = ct*ct - C2*s2, t, hit;
  if (disc >= 0){ t = C2/(ct*R + Math.sqrt(disc)); hit = 1; }
  else { t = R*ct; hit = 0; }
  out[0] = t*d[0] + R*camU[0];
  out[1] = t*d[1] + R*camU[1];
  out[2] = t*d[2] + R*camU[2];
  norm(out);
  return hit ? 2 : 1;
}

/* Puts the world point G exactly under pixel (px,py), solving lon/lat in
   closed form. A north-up camera has exactly 2 degrees of freedom for 2
   constraints, so the solution is exact — no iteration, and no drift
   accumulating across a drag or a zoom. */
function place(G, px, py){
  var cw = canvas.clientWidth, chh = canvas.clientHeight;
  var nx = (px/cw)*2 - 1, ny = 1 - (py/chh)*2;
  var dx = nx*TANHF*(cw/chh), dy = ny*TANHF, dz = -1;
  var dl = Math.sqrt(dx*dx + dy*dy + 1); dx/=dl; dy/=dl; dz/=dl;

  // sphere intersection in camera coordinates (centre at (0,0,-R))
  var bb = -R*dz;
  if (bb <= 0) return false;
  var disc = bb*bb - C2;
  var t = disc >= 0 ? C2/(bb + Math.sqrt(disc)) : bb;   // outside the disc: tangent point
  var a = t*dx, b = t*dy, c = t*dz + R;
  var gl2 = Math.sqrt(a*a + b*b + c*c);
  if (gl2 < 1e-12) return false;
  a/=gl2; b/=gl2; c/=gl2;

  // G_y = b*cos(phi) + c*sin(phi)  ->  phi
  var rho = Math.sqrt(b*b + c*c);
  if (rho < 1e-12) return false;
  var sv = G[1]/rho, psi = Math.atan2(b, c), phi;
  var LIM = 89.9999*DEG, cur = lat*DEG;
  if (sv >= 1 || sv <= -1){
    phi = (sv > 0 ? Math.PI/2 : -Math.PI/2) - psi;      // unreachable: closest possible
  } else {
    var as = Math.asin(sv), best = null, bd = Infinity;
    var cand = [as - psi, Math.PI - as - psi];
    for (var i = 0; i < cand.length; i++){
      for (var k = -1; k <= 1; k++){
        var v = cand[i] + k*2*Math.PI;
        if (v < -LIM || v > LIM) continue;
        var d = Math.abs(v - cur);
        if (d < bd){ bd = d; best = v; }
      }
    }
    if (best === null) return false;
    phi = best;
  }
  if (phi >  LIM) phi =  LIM;
  if (phi < -LIM) phi = -LIM;

  // solve lon from the x,z components
  var cp = Math.cos(phi), sp = Math.sin(phi);
  var K = c*cp - b*sp, den = a*a + K*K;
  if (den < 1e-18) return false;
  lat = phi/DEG;
  lon = Math.atan2((-a*G[0] - K*G[2])/den, (K*G[0] - a*G[2])/den)/DEG;
  updateCam();
  return true;
}

/* ============================================================
   5. INTERACTION - drag to rotate, wheel to zoom
   ============================================================ */
var pointers = new Map();
var grabG = null, pinchDist = 0, anchor = null;
var dirty = true;

function clampLog(v){
  var lo = Math.log(H_MIN), hi = Math.log(H_MAX);
  return v < lo ? lo : v > hi ? hi : v;
}
function grab(cx, cy){
  var r = canvas.getBoundingClientRect(), o = [0,0,0];
  return pick(cx - r.left, cy - r.top, o) ? o : null;
}
function pinchSpan(){
  var a = null, b = null;
  pointers.forEach(function(v){ if(!a) a = v; else if(!b) b = v; });
  return (a && b) ? Math.sqrt((a.x-b.x)*(a.x-b.x) + (a.y-b.y)*(a.y-b.y)) : 0;
}

canvas.addEventListener('pointerdown', function(e){
  try { canvas.setPointerCapture(e.pointerId); } catch(_){}
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  anchor = null;
  if (pointers.size === 1){
    grabG = grab(e.clientX, e.clientY);
    canvas.classList.add('drag');
  } else if (pointers.size === 2){
    grabG = null; pinchDist = pinchSpan();
  }
});

canvas.addEventListener('pointermove', function(e){
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 1 && grabG){
    var r = canvas.getBoundingClientRect();
    if (place(grabG, e.clientX - r.left, e.clientY - r.top)) requestRender();
  } else if (pointers.size === 2){
    var d = pinchSpan();
    if (pinchDist > 0 && d > 0){
      logHTarget = clampLog(logHTarget - Math.log(d/pinchDist));
      logH = logHTarget; updateCam(); requestRender();
    }
    pinchDist = d;
  }
});

function endPointer(e){
  pointers.delete(e.pointerId);
  if (pointers.size === 0){ grabG = null; canvas.classList.remove('drag'); }
  else if (pointers.size === 1){
    pointers.forEach(function(v){ grabG = grab(v.x, v.y); });
    pinchDist = 0;
  }
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);

canvas.addEventListener('wheel', function(e){
  e.preventDefault();
  var dy = e.deltaY;
  if (e.deltaMode === 1) dy *= 16;
  else if (e.deltaMode === 2) dy *= 400;
  if (dy > 240) dy = 240; else if (dy < -240) dy = -240;
  var r = canvas.getBoundingClientRect();
  var px = e.clientX - r.left, py = e.clientY - r.top;
  var g = [0,0,0];
  anchor = (pick(px, py, g) === 2) ? { g: g, px: px, py: py } : null;
  logHTarget = clampLog(logHTarget + dy*0.0032);
  requestRender();
}, { passive: false });

/* keeps the point under the cursor pinned while the zoom eases */
function reanchor(){
  if (anchor) place(anchor.g, anchor.px, anchor.py);
}

/* ============================================================
   6. RENDER LOOP
   ============================================================ */
var dpr = 1, vpW = 0, vpH = 0;
function resize(){
  dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  var w  = Math.max(1, Math.round(canvas.clientWidth*dpr));
  var hh = Math.max(1, Math.round(canvas.clientHeight*dpr));
  if (w !== vpW || hh !== vpH){
    vpW = w; vpH = hh;
    canvas.width = w; canvas.height = hh;
    gl.viewport(0, 0, w, hh);
    requestRender();
  }
}
window.addEventListener('resize', resize);
if (window.ResizeObserver) new ResizeObserver(resize).observe(canvas);

function pixelLOD(){
  var degPerPx = (h*FOV/vpH)/DEG;
  for (var i = LODS.length - 1; i >= 0; i--) if (LODS[i].tol <= 0.8*degPerPx) return i;
  return 0;
}
function lodAt(L, best){
  if (L.cache[best]) return L.cache[best];
  var i;
  for (i = best; i >= 0; i--) if (L.cache[i]) return L.cache[i];   // prefer too much detail
  for (i = best; i < LODS.length; i++) if (L.cache[i]) return L.cache[i];
  return null;
}
function pickLOD(L){ return lodAt(L, pixelLOD()); }

var BG_TOP = new Float32Array([0.918, 0.929, 0.937]);
var BG_BOT = new Float32Array([0.839, 0.855, 0.871]);

var RELIEF_ON = false;
var RELIEF_AMT = 1.0;        // overall strength
var RELIEF_SLOPE = 2.5;      // vertical exaggeration

var last = 0, rafId = 0;
function requestRender(){
  dirty = true;
  if (!rafId) rafId = requestAnimationFrame(frame);
}

function frame(ts){
  rafId = 0;
  resize();
  var dt = last ? Math.min((ts - last)/1000, 0.1) : 0.016;
  last = ts;

  var easing = Math.abs(logHTarget - logH) > 1e-7;
  if (easing){
    logH += (logHTarget - logH)*(1 - Math.exp(-dt/0.055));
    if (Math.abs(logHTarget - logH) <= 1e-7) logH = logHTarget;
    updateCam();
    reanchor();
    dirty = true;
  } else if (anchor && !pointers.size){
    anchor = null;
  }

  if (!dirty){
    if (easing) requestRender();
    if (!rafId) last = 0;
    return;
  }
  dirty = false;
  draw();

  if (easing) requestRender();
  if (!rafId) last = 0;
}

/* ---------- view culling ----------
   The instance buffer is laid out in cell order, so the visible cells
   collapse into a few contiguous ranges. Each range is drawn by re-pointing
   the instance attributes at its byte offset — WebGL2 has no baseInstance. */
var MAXR = 64;
var rngS = new Int32Array(MAXR), rngC = new Int32Array(MAXR), rngN = 0;
var capTmp = [0,0,0], drawn = 0;

/* angular radius, about the sub-camera point, of a cap containing
   everything currently on screen */
function viewCapRadius(){
  var thH = Math.acos(Math.max(-1, Math.min(1, 1/R)));
  var W = canvas.clientWidth, H = canvas.clientHeight;
  var pts = [0,0, W,0, 0,H, W,H, W/2,0, W/2,H, 0,H/2, W,H/2];
  var maxA = 0, i, d, a;
  for (i = 0; i < pts.length; i += 2){
    if (pick(pts[i], pts[i+1], capTmp) !== 2) return thH;   // sees past the limb
    d = capTmp[0]*camU[0] + capTmp[1]*camU[1] + capTmp[2]*camU[2];
    a = Math.acos(Math.max(-1, Math.min(1, d)));
    if (a > maxA) maxA = a;
  }
  maxA = maxA*1.06 + 0.003;
  return maxA < thH ? maxA : thH;
}

/* false = culling not worth it, draw the whole buffer */
function buildRanges(lod, viewRho){
  var rho = viewRho + lod.margin;
  if (rho > 0.55) return false;
  var cr = Math.cos(rho), sr = Math.sin(rho);
  var span = rho/DEG + CELL;
  var y0 = ((lat - span + 90)/CELL)|0, y1 = ((lat + span + 90)/CELL)|0;
  if (y0 < 0) y0 = 0;
  if (y1 >= NLAT) y1 = NLAT - 1;
  var st = lod.start, n = 0, curS = -1, curE = -1, y, x, base, ci, a, b, d;
  for (y = y0; y <= y1; y++){
    base = y*NLON;
    for (x = 0; x < NLON; x++){
      ci = base + x;
      a = st[ci]; b = st[ci+1];
      if (a === b) continue;                                  // empty cell
      d = cellDir[3*ci]*camU[0] + cellDir[3*ci+1]*camU[1] + cellDir[3*ci+2]*camU[2];
      if (d < cr*cellCos[ci] - sr*cellSin[ci]) continue;      // cap misses the view
      if (curS < 0){ curS = a; curE = b; }
      else if (a - curE <= 1024){ curE = b; }                 // bridge small gaps
      else {
        if (n === MAXR) return false;
        rngS[n] = curS; rngC[n] = curE - curS; n++;
        curS = a; curE = b;
      }
    }
  }
  if (curS >= 0){
    if (n === MAXR) return false;
    rngS[n] = curS; rngC[n] = curE - curS; n++;
  }
  rngN = n;
  return true;
}

function drawRange(first, count){
  var off = first*36;
  gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 36, off);
  gl.vertexAttribPointer(1, 3, gl.FLOAT, false, 36, off + 12);
  gl.vertexAttribPointer(2, 3, gl.FLOAT, false, 36, off + 24);
  gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, count);
  drawn += count;
}

function draw(){
  var aspect = vpW/vpH;
  drawn = 0;
  var viewRho = viewCapRadius();

  gl.disable(gl.BLEND);
  gl.bindVertexArray(emptyVao);
  gl.useProgram(pSph);
  gl.uniform3f(uSph.uRight, camX[0], camX[1], camX[2]);
  gl.uniform3f(uSph.uUp,    camY[0], camY[1], camY[2]);
  gl.uniform3f(uSph.uFwd,  -camU[0], -camU[1], -camU[2]);
  gl.uniform3f(uSph.uCamDir, camU[0], camU[1], camU[2]);
  gl.uniform3fv(uSph.uLight, lightW);
  gl.uniform3fv(uSph.uBgTop, BG_TOP);
  gl.uniform3fv(uSph.uBgBot, BG_BOT);
  gl.uniform1f(uSph.uTanHF, TANHF);
  gl.uniform1f(uSph.uAspect, aspect);
  gl.uniform1f(uSph.uC2, C2);
  gl.uniform1f(uSph.uR, R);
  gl.uniform1f(uSph.uInvR, 1/R);
  gl.uniform1f(uSph.uHOverR, h/R);

  /* The raster is the one part of this with a finite resolution, so it fades
     out once the screen is magnifying it past roughly 8x — past that it is
     blur pretending to be terrain, while the vector lines stay sharp. */
  var ramt = 0;
  if (RELIEF_ON && reliefTex){
    var t = (h*FOV/vpH)/(2*Math.PI/RELIEF_W);      // texels per screen pixel
    var fade = (t - 0.04)/0.08;
    ramt = RELIEF_AMT*(fade < 0 ? 0 : fade > 1 ? 1 : fade);
  }
  if (ramt > 0){
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, reliefTex);
    gl.uniform1i(uSph.uRelief, 0);
    gl.uniform2f(uSph.uTexel, 1/RELIEF_W, 1/RELIEF_H);
    gl.uniform2f(uSph.uTexSize, RELIEF_W, RELIEF_H);
    gl.uniform1f(uSph.uSlope, RELIEF_SLOPE);
  }
  gl.uniform1f(uSph.uReliefAmt, ramt);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  var ORDER = [1, 2, 0];                   // subdivisions, land borders, coast on top
  var started = false, li, L, lod, halfW;
  for (li = 0; li < ORDER.length; li++){
    L = LAYERS[ORDER[li]];
    if (!L.on) continue;
    lod = pickLOD(L);
    if (!lod) continue;

    if (!started){
      gl.enable(gl.BLEND);
      gl.blendFuncSeparate(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA, gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
      gl.useProgram(pLin);
      gl.uniform3fv(uLin.uCamHi, camHi);
      gl.uniform3fv(uLin.uCamLo, camLo);
      gl.uniformMatrix3fv(uLin.uView, false, viewMat);
      gl.uniform2f(uLin.uVp, vpW, vpH);
      gl.uniform1f(uLin.uTanHF, TANHF);
      gl.uniform1f(uLin.uAspect, aspect);
      gl.uniform1f(uLin.uNear, h*0.5);
      gl.uniform3f(uLin.uCamDir, camU[0], camU[1], camU[2]);
      gl.uniform3fv(uLin.uLight, lightW);
      gl.uniform1f(uLin.uHorizK, C2/R);
      gl.uniform1f(uLin.uR, R);
      started = true;
    }

    halfW = L.width*dpr*0.5;
    gl.uniform1f(uLin.uPad, halfW + 1.0);
    gl.uniform1f(uLin.uHalfW, halfW);
    gl.uniform3fv(uLin.uLineColor, L.color);
    gl.bindVertexArray(lod.vao);
    gl.bindBuffer(gl.ARRAY_BUFFER, lod.vbo);
    if (buildRanges(lod, viewRho)){
      for (var ri = 0; ri < rngN; ri++) drawRange(rngS[ri], rngC[ri]);
    } else {
      rngN = 0;
      drawRange(0, lod.count);
    }
  }
  gl.bindVertexArray(null);
}

resize();
updateCam();
uploadLOD(LAYERS[0], 3);          // coarse country level before the first frame
requestRender();

/* the rest builds in the background; subdivisions land early so the button
   never opens onto an empty globe */
var pending = [[2,2],[0,2],[1,3],[2,1],[0,1],[1,2],[2,0],[0,0],[1,1],[1,0],[2,4],[0,4],[1,4]];
(function next(){
  if (!pending.length) return;
  var j = pending.shift();
  setTimeout(function(){
    uploadLOD(LAYERS[j[0]], j[1]);
    requestRender(); next();
  }, 30);
})();

/* ---- toggles ---- */
var btn = document.getElementById('detail');
function setDetail(on){
  LAYERS[1].on = on;
  btn.setAttribute('aria-pressed', on ? 'true' : 'false');
  if (on && !LAYERS[2].on) setBorders(true);
  requestRender();
}
btn.addEventListener('click', function(){ setDetail(!LAYERS[1].on); btn.blur(); });

var btnB = document.getElementById('borders');
/* Subdivisions and land borders are coupled. The admin_0 segments were
   subtracted out of the subdivision layer, so wherever a state line runs
   along a national one there is no line left in it — drawing subdivisions
   without the country borders underneath erases the countries from the
   middle of a continent and flattens the hierarchy into one weight. */
function setBorders(on){
  LAYERS[2].on = on;
  btnB.setAttribute('aria-pressed', on ? 'true' : 'false');
  if (!on && LAYERS[1].on) setDetail(false);
  requestRender();
}
btnB.addEventListener('click', function(){ setBorders(!LAYERS[2].on); btnB.blur(); });

var btnR = document.getElementById('relief');
function setRelief(on){
  RELIEF_ON = on;
  btnR.setAttribute('aria-pressed', on ? 'true' : 'false');
  requestRender();
}
btnR.addEventListener('click', function(){ setRelief(!RELIEF_ON); btnR.blur(); });

window.addEventListener('keydown', function(e){
  if (e.key === 'd' || e.key === 'D'){ setDetail(!LAYERS[1].on); }
  else if (e.key === 'b' || e.key === 'B'){ setBorders(!LAYERS[2].on); }
  else if (e.key === 'r' || e.key === 'R'){ setRelief(!RELIEF_ON); }
});

window.__globe = {
  render: function(){ resize(); updateCam(); draw(); },
  info: function(){
    return { lon: lon, lat: lat, h: h, altKm: h*6371,
             detail: LAYERS[1].on, borders: LAYERS[2].on,
             relief: RELIEF_ON, reliefReady: !!reliefTex,
             drawn: drawn, ranges: rngN,
             lods: LAYERS.map(function(L){ return L.cache.map(function(c){ return c ? c.count : null; }); }),
             vp: [vpW, vpH], dpr: dpr };
  },
  set: function(o){
    if (o.lon !== undefined) lon = o.lon;
    if (o.lat !== undefined) lat = o.lat;
    if (o.h   !== undefined) logH = logHTarget = clampLog(Math.log(o.h));
    if (o.detail !== undefined) setDetail(!!o.detail);
    if (o.borders !== undefined) setBorders(!!o.borders);
    if (o.relief !== undefined) setRelief(!!o.relief);
    if (o.slope !== undefined) RELIEF_SLOPE = o.slope;
    if (o.amt !== undefined) RELIEF_AMT = o.amt;
    anchor = null; updateCam(); requestRender();
  }
};
})();
</script>
